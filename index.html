<!doctype html>
<html lang="hi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ravindra Games Hub</title>
    <meta name="description"
        content="Ravindra Games Hub — collection of lightweight web games (TicTacToe, Mastermind, Memory...)">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/rgh-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/rgh-512x512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="commoncss.css">
    <link rel="stylesheet" href="./leaderboard/gbfeedback.css" />
    <link rel="stylesheet" href="./leaderboard/gbleaderboard.css" />
    <link rel="stylesheet" href="./leaderboard/lcleaderboard.css" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta name="theme-color" content="#6200ee" />
</head>

<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="logo">
                    <img src="./assets/icons/rgh-192x192.png" alt="Game Logo" style="width: 7vw; height: 7vw;">
                </div>
                <div class="title">
                    <h1>Ravindra Games Hub</h1>
                    <p class="lead">Enhance your brain with fun browser games(PWA-ready)</p>
                </div>
            </div>
            <div class="hdrbtns">
                <div class="hdr-child-div">
                    <button class="button-primary" id="toggle-gb-leaderboard" onclick="openGlobalLeaderboard()">🌍 Global Leaderboard</button>
                    <button class="button-primary" id="toggle-lc-leaderboard" onclick="openLocalLeaderboard()">🏆 Local Leaderboard</button>
                </div>
                <div class="hdr-child-div">
                    <button class="button-primary" id="shareBtn">📤Sharing</button>
                    <button class="button-primary" onclick="openGlobalFeedback()">💬 Feedback</button>
                    <button class="button-primary"
                    onclick="window.location.href='https://rnsaraswat.github.io/games/auth/login.html'">🚪Sign in</button>
                    <button class="button-primary" id="themeToggle">☀️ Light</button>
                </div>
                <p id="welcom" class="lead">Welcome</p>
            </div>
        </header>


        <main>
            <section class="grid" id="gamesGrid">
                <!-- <article class="game-card"><img class="thumb" src="/assets/icons/icon-512.png">
                    <div class="content">
                        <h3>Tic Tac Toe</h3>
                        <p>Classic X vs O</p><a class="play-btn" href="games/tictactoe/index.html">Play ▶</a>
                    </div>
                </article>
                <article class="game-card"><img class="thumb" src="/assets/icons/icon-512.png">
                    <div class="content">
                        <h3>Mastermind</h3>
                        <p>Guess the color code</p><a class="play-btn" href="games/mastermind/index.html">Play ▶</a>
                    </div>
                </article> -->
            </section>
        </main>


        <footer style="margin-top:20px;color:var(--muted)">© 2025 Ravindra</footer>
    </div>
    <div id="gb-feedbackModal" class="gb-feedback-main-container"></div>
    <div id="lcLeaderboardModal" class="lc-main-container"></div>
    <div id="gbLeaderboardModal" class="gb-main-container"></div>
    <script src="./leaderboard/submit-helper.js"></script>
    <script type="module" src="./leaderboard/gbfeedback.js"></script>
    <script type="module" src="./leaderboard/gbleaderboard.js"></script>
    <script type="module" src="./leaderboard/lcleaderboard.js"></script>
    <script type="module">
        import { shareScore } from './leaderboard/share.js';
        document.getElementById("shareBtn").addEventListener("click", async () => {
            shareScore("-", 0);
        });
    </script>


    <script>
        const games = [
            { id: 'memory', name: 'memory', title: 'Memory', desc: 'Flip, match, win', href: 'games/memory/index.html' },
            { id: 'rockpaperscissor', name: 'rockpaperscissor', title: 'Rock Paper Scissor', desc: 'Classic & Action-Oriented X vs O', href: 'games/rock_paper_scissor/index.html' },
            { id: 'watersort', name: 'watersort', title: 'Water Sort', desc: 'Train your critical thinking', href: 'games/watersort/index.html' },
            { id: 'tictactoe', name: 'tictactoe', title: 'Tic Tac Toe', desc: "Challange Beat the HARD level against the computer", href: 'games/tictactoe/index.html' },
            { id: 'mastermind', name: 'mastermind', title: 'Master Mind', desc: 'Thinking without limits', href: 'games/mastermind/index.html' },
            { id: '5inARow', name: '5inarow', title: '5 in A Row', desc: "It's not just luck, it's strategy", href: 'games/5inARow/index.html' },
            { id: 'connect4', name: 'connect4', title: 'Connect 4', desc: 'Endless ways to connect four X vs O', href: 'games/connect_4/index.html' },
            { id: 'sudoku', name: 'sudoku', title: 'Sudoku', desc: 'Solve logic puzzles of various sizes', href: 'games/sudoku/index.html' },
            { id: '4inARow', name: '4inarow', title: '4 in A Row', desc: 'Classic & Action-Oriented X vs O', href: 'games/4inARow/index.html' },
            { id: 'connect3', name: 'connect3', title: 'Connect 3', desc: 'Connect Three Classic X vs O', href: 'games/connect_3/index.html' },
            { id: 'sudokusolver', name: 'sudokusolver', title: 'Sudoku Solver', desc: 'Solve your sudoku Puzzle', href: 'games/sudoku_solver/index.html' },
            { id: 'tictactoe1', name: 'tictactoe', title: 'Tic Tac Toe New', desc: "One wrong move, and it's over X vs O", href: 'games/tictactoe1/index.html' },
            { id: '3inARow', name: 'threeinarow', title: '3 in Row', desc: "It's not just luck, it's strategy X vs O", href: 'games/3inARow/index.html' },
            { id: 'mastermind1', name: 'mastermind', title: 'Mastermind', desc: 'Thinking without limits', href: 'games/mastermindtext/mastermind_text.html' },
            { id: 'tictactoe3', name: 'tictactoe', title: 'Tic Tac Toe Share', desc: "Three in a row to win X vs O", href: 'games/tictactoe3/index.html' },
            { id: 'project', name: 'Project', title: 'Project Share', desc: "Three in a row to win X vs O", href: 'games/project/index.html' }
        ];

        const player_name = localStorage.getItem('player_name') || 'Guest';

        document.getElementById("welcom").textContent = `Welcome ${player_name}`;
        document.getElementById("welcom").style.alignContent = "center";
        const grid = document.getElementById('gamesGrid');
        games.forEach(g => {
            const card = document.createElement('article');
            card.className = 'game-card';
            card.dataset = g.id;
            card.innerHTML = `<h3>${g.title}</h3><p>${g.desc}</p><div class='actions'><a href='${g.href}' class='play-btn'>Play</a></div>`;
            grid.appendChild(card);
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        function setTheme(t) {
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '☀️Light'
            }
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '🌙 Dark'
            }
        }
        if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
        setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

        function openGlobalLeaderboard() {
      document.getElementById("gbLeaderboardModal").style.display = 'flex';
    };

    function closeGlobalLeaderboard() {
      document.getElementById("gbLeaderboardModal").style.display = 'none';
    };


    fetch('./leaderboard/gbleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('gbLeaderboardModal').innerHTML = htmlText;
        document.getElementById("gbLeaderboardModal").style.display = 'none';
      });

    function openLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'flex';
    };

    function closeLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'none';
    };

    fetch('./leaderboard/lcleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
        document.getElementById("lcLeaderboardModal").style.display = 'none';
      });

    function openGlobalFeedback() {
      document.getElementById("gb-feedbackModal").style.display = 'flex';
    };

    function closeGlobalFeedback() {
      document.getElementById("gb-feedbackModal").style.display = 'none';
    };

    fetch('./leaderboard/gbfeedback.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('gb-feedbackModal').innerHTML = htmlText;
        document.getElementById("gb-feedbackModal").style.display = 'none';
      });
        (async () => {
            const GAME_NAME = "Ravindra Games Hub";
            const GAME_SHORT = "RGH Games";

            const res = await fetch("./manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();

    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./sw.js")
                    .then(() => console.log("SW registered"))
                    .catch((err) => console.log("SW error", err));
            });
        }
    </script>
</body>

</html>
