<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mastermind</title>
  <meta name="description"
  content="Ravindra Games Hub — collection of lightweight web games (mastermind) Guess the secret color code find the correct color code in correct pegs">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../leaderboard/firebasefeedback.css" />
  <link rel="stylesheet" href="../../leaderboard/firebasegbleaderboard.css" />
  <link rel="stylesheet" href="../../leaderboard/lcleaderboard.css" />
  <link rel="stylesheet" href="../../commoncss.css">
  <link rel="manifest" href="../../manifest.json" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta name="theme-color" content="#6200ee" />
</head>

<body>
  <div id="container">
    <!-- Left Panel -->
    <div id="left" class="section">
      <h1>🎯Mastermind</h1>
      <div class="button-group">
        <div class="button-group" style="border: 0.1vw solid var(--cell-border);">
          <label for="slotInput">⁷⁷⁷ No of slots:</label>
          <select id="slotInput">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
          <!-- <label for="slotInput">⁷⁷⁷ No of Slots:
            <input type="number" id="slotInput" min="1" max="12" value="4">
          </label> -->
          <!-- <label for="colorInput">📚 No of Colors:
            <input type="number" id="colorInput" min="1" max="20" value="6">

          </label> -->
          <label for="colorInput">📚 No of Colors:</label>
          <select id="colorInput">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6" selected>6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
          </select>
          <label>Max Attempts:</label>
            <input type="number" id="maxAttempts" min="4" max="20" value="12">
          <button class="button-primary" id="buttonStart">🔄 New Game</button>
          <p id="diffcultydisplay">Very Easy</p>
        </div>
          <label id="allowedDuplicates">👯 Allow Duplicate Colors
            <input type="checkbox" id="buttonDuplicate" checked>
          </label>
          <button id="toggle-rules">📜View Rules</button>

        <button id="undo-last">↩️ Undo</button>
        <button id="buttonEnd">🔚 End</button>
        <button id="toggle-theme">☀️ Light</button>
        <button id="toggle-sound">🔇 Music:Off"</button>
        <button class="button-primary" id="toggle-gb-leaderboard" onclick="openFirebaseGlobalLeaderboard()">🌍 Global Leaderboard</button>
        <button class="button-primary" id="toggle-lc-leaderboard" onclick="openLocalLeaderboard()">🏆 Local Leaderboard</button>
        <button class="button-primary" id="shareBtn">📤Sharing</button>
        <button class="button-primary" onclick="openGlobalFeedback()">💬 Feedback</button>
        <button class="button-primary"
          onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
        <div id="timer-display">⏱️ 00:00:00</div>
        <div class="message" id="output">
          Please Click on Circle to select your secreate colors and press Start
        </div>
        <p id="loading" class="loading">Loading...</p>
      </div>
    </div>
    <!-- Right Grid -->
    <div id="right">
      <div class="board" id="secretBoard"></div>
      <div id="game">
        <div id="colorPopup" class="popup"></div>
        <div id="visualGuesses"></div>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>
  <div id="rules-popup-window" class="rules-feedback-main-container"></div>
  <div id="fb-feedbackModal" class="fb-container"></div>
  <div id="lcLeaderboardModal" class="lc-main-container"></div>
  <div id="firebaseLeaderboardModal" class="firebase-main-container"></div>
  <div id="rulesPopup" class="rules-popup-window">
    <div class="rules-header-section">
      <span id="rulesCloseBtn" class="rules-popup-close">Close X</span>
      <h2 class="rules-h2">Game Rules</h2>
    </div>
    <div class="rules-content">
      <p id="RulesBox"></p>
    </div>
  </div>
  <canvas id="fireworksCanvas"></canvas>
  <div id="winText">🎉 You Won! 🎉</div>
  <canvas id="fireworksCanvas"></canvas>
  <script type="module" src="../../leaderboard/firebasefeedback.js"></script>
  <script type="module" src="../../leaderboard/firebasegbleaderboard.js"></script>
  <script type="module" src="../../leaderboard/lcleaderboard.js"></script>
  <script type="module" src="js/script.js"></script>
  <script type="module" src="../../leaderboard/leaderboard-controller.js"></script>
  <script type="module" src="js/rules.js"></script>
  <script>
    document.getElementById("fb-feedbackModal").style.display = 'none';
    document.getElementById("lcLeaderboardModal").style.display = 'none';
    document.getElementById("firebaseLeaderboardModal").style.display = 'none';
    document.getElementById("winText").style.display = 'none';
    document.getElementById("rulesPopup").style.display = 'none';

    const themeToggle = document.getElementById('toggle-theme');
    function setTheme(t) {
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '☀️ Light'
      }
      if (t === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '🌙 Dark'
      }
    }
    if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
    setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

    function openFirebaseGlobalLeaderboard() {
      document.getElementById("firebaseLeaderboardModal").style.display = 'flex';
    };

    function closeFirebaseGlobalLeaderboard() {
      document.getElementById("firebaseLeaderboardModal").style.display = 'none';
    };

    fetch('../../leaderboard/firebasegbleaderboard.html')
    .then(response => response.text())
            .then(htmlText => {
                document.getElementById('firebaseLeaderboardModal').innerHTML = htmlText;
                document.getElementById("firebaseLeaderboardModal").style.display = 'none';

                setTimeout(() => {
                    console.log("window.initLeaderboard =", window.initLeaderboard);
                    if (window.initLeaderboard) {
                        window.initLeaderboard();
                    } else {
                        console.error("initLeaderboard not found");
                    }
                }, 500);
            });

    function openLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'flex';
    };

    function closeLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'none';
    };

    function clearLLB() {
      if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
        localStorage.removeItem('leaderboard');
        alert("All games Local Leaderboard Data is Cleared");
        textToSpeechEng('Local Leaderboard data cleared');
      }
    };
    
    fetch('../../leaderboard/lcleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
        document.getElementById("lcLeaderboardModal").style.display = 'none';
      });

    function openGlobalFeedback() {
      document.getElementById("fb-feedbackModal").style.display = 'flex';
    };

    function closeFBFeedback() {
      document.getElementById("fb-feedbackModal").style.display = 'none';
    };

    fetch('../../leaderboard/firebasefeedback.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('fb-feedbackModal').innerHTML = htmlText;
        document.getElementById("fb-feedbackModal").style.display = 'none';
      });

    (async () => {
            const GAME_NAME = "Mastermind Game";
            const GAME_SHORT = "mastermind";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/mastermind/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/mastermind/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("../../sw.js")
          .then(() => console.log("SW registered"))
          .catch((err) => console.log("SW error", err));
      });
    }
  </script>
</body>

</html>
