<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag Drop Tube Animation</title>
  <!-- <link rel="stylesheet" href="style.css"> -->
  <style>
    body {
  margin: 0;
  background: #111;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.game {
  display: flex;
  gap: 40px;
}

.tube {
  width: 80px;
  height: 250px;
  border: 3px solid white;
  border-radius: 0 0 40px 40px;
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  padding: 10px 0;
  position: relative;
}

.block {
  width: 60px;
  height: 40px;
  margin: 3px 0;
  border-radius: 8px;
  cursor: grab;
  transition: transform 0.3s ease;
}

.red { background: red; }
.blue { background: blue; }
.green { background: green; }

.dragging {
  position: fixed;
  pointer-events: none;
  z-index: 1000;
  transform: scale(1.1);
}
  </style>
</head>
<body>

<div class="game">

  <div class="tube" id="tube1">
    <div class="block red"></div>
    <div class="block blue"></div>
  </div>

  <div class="tube" id="tube2">
    <div class="block green"></div>
  </div>

  <div class="tube" id="tube3"></div>

</div>

<!-- <script src="script.js"></script> -->
<script>
    let selectedBlock = null;
let offsetX = 0;
let offsetY = 0;

// -------------------
// Mouse + Touch Start
// -------------------
document.addEventListener("pointerdown", function(e) {

  if (e.target.classList.contains("block")) {

    const parentTube = e.target.parentElement;

    // सिर्फ ऊपर वाला block move हो
    if (parentTube.lastElementChild !== e.target) return;

    selectedBlock = e.target;

    const rect = selectedBlock.getBoundingClientRect();

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    selectedBlock.classList.add("dragging");

  }
});

// -------------------
// Move
// -------------------
document.addEventListener("pointermove", function(e) {

  if (!selectedBlock) return;

  selectedBlock.style.left = (e.clientX - offsetX) + "px";
  selectedBlock.style.top = (e.clientY - offsetY) + "px";
});

// -------------------
// Drop
// -------------------
document.addEventListener("pointerup", function(e) {

  if (!selectedBlock) return;

  selectedBlock.classList.remove("dragging");

  const tubes = document.querySelectorAll(".tube");

  let dropped = false;

  tubes.forEach(tube => {

    const rect = tube.getBoundingClientRect();

    if (
      e.clientX > rect.left &&
      e.clientX < rect.right &&
      e.clientY > rect.top &&
      e.clientY < rect.bottom
    ) {
      tube.appendChild(selectedBlock);
      selectedBlock.style.left = "";
      selectedBlock.style.top = "";
      dropped = true;
    }

  });

  // अगर valid drop नहीं हुआ तो वापस original जगह
  if (!dropped) {
    selectedBlock.style.left = "";
    selectedBlock.style.top = "";
  }

  selectedBlock = null;
});
</script>
</body>
</html>
