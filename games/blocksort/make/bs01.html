<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Water Sort Game</title>
<link rel="stylesheet" href="style.css">
<style>
    body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

.game{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:30px;
}

.tube{
  width:80px;
  height:260px;
  border:3px solid white;
  border-radius:0 0 40px 40px;
  display:flex;
  flex-direction:column-reverse;
  align-items:center;
  padding:10px 0;
  cursor:pointer;
}

.block{
  width:60px;
  height:40px;
  margin:3px 0;
  border-radius:8px;
}

.selected{
  transform:translateY(-20px);
}

.info{
  margin-top:20px;
}
</style>
</head>
<body>

<h2>Water Sort Game</h2>

<div class="info">
  ⏱ Time: <span id="time">00:00:00</span>
  🎯 Moves: <span id="moves">0</span>
  ⭐ Score: <span id="score">0</span>
  <button id="undoBtn">Undo</button>
</div>

<div class="game" id="game"></div>

<script src="script.js"></script>
<script>
    const MAX_HEIGHT = 4;
let tubes = [
  ["red","blue","red","blue"],
  ["green","green","blue","red"],
  [],
  []
];

let selected = null;
let fromIndex = null;
let moveHistory = [];
let moves = 0;
let seconds = 0;
let timerInterval;

const game = document.getElementById("game");

// ------------------ INIT ------------------
function init(){
  render();
  startTimer();
}
init();

// ------------------ RENDER ------------------
function render(){
  game.innerHTML = "";
  tubes.forEach((tube,i)=>{
    const div = document.createElement("div");
    div.className="tube";
    div.dataset.index=i;

    tube.forEach(color=>{
      const block=document.createElement("div");
      block.className="block";
      block.style.background=color;
      div.appendChild(block);
    });

    game.appendChild(div);
  });
}

// ------------------ SELECT & MOVE ------------------
game.addEventListener("click",function(e){

  const tubeDiv = e.target.closest(".tube");
  if(!tubeDiv) return;

  const index = parseInt(tubeDiv.dataset.index);

  // SELECT
  if(selected===null){
    if(tubes[index].length===0) return;

    selected = tubes[index][tubes[index].length-1];
    fromIndex = index;
    highlight(index);

  }
  // DROP
  else{
    if(isValidMove(fromIndex,index)){
      makeMove(fromIndex,index);
    }
    clearHighlight();
    selected=null;
    fromIndex=null;
  }
});

// ------------------ VALIDATION ------------------
function isValidMove(from,to){

  if(from===to) return false;
  if(tubes[from].length===0) return false;
  if(tubes[to].length>=MAX_HEIGHT) return false;

  const movingColor = tubes[from][tubes[from].length-1];
  const targetTop = tubes[to][tubes[to].length-1];

  if(!targetTop) return true;
  return movingColor===targetTop;
}

// ------------------ MOVE ------------------
function makeMove(from,to){

  moveHistory.push(JSON.stringify(tubes));

  const color = tubes[from].pop();
  tubes[to].push(color);

  moves++;
  updateInfo();

  render();
  checkWin();
}

// ------------------ UNDO ------------------
document.getElementById("undoBtn").onclick=function(){
  if(moveHistory.length>0){
    tubes=JSON.parse(moveHistory.pop());
    moves--;
    updateInfo();
    render();
  }
};

// ------------------ TIMER ------------------
function startTimer(){
  timerInterval=setInterval(()=>{
    seconds++;
    updateInfo();
  },1000);
}

function formatTime(sec){
  const h=Math.floor(sec/3600).toString().padStart(2,"0");
  const m=Math.floor((sec%3600)/60).toString().padStart(2,"0");
  const s=(sec%60).toString().padStart(2,"0");
  return `${h}:${m}:${s}`;
}

// ------------------ SCORE ------------------
function calculateScore(){
  return Math.max(1000 - (moves*10 + seconds*2),0);
}

function updateInfo(){
  document.getElementById("time").textContent=formatTime(seconds);
  document.getElementById("moves").textContent=moves;
  document.getElementById("score").textContent=calculateScore();
}

// ------------------ WIN CHECK ------------------
function checkWin(){

  const win = tubes.every(tube=>{
    if(tube.length===0) return true;
    if(tube.length!==MAX_HEIGHT) return false;
    return tube.every(color=>color===tube[0]);
  });

  if(win){
    clearInterval(timerInterval);
    alert("🎉 You Win! Score: "+calculateScore());
  }
}

// ------------------ UI ------------------
function highlight(index){
  render();
  const tubeDiv = document.querySelectorAll(".tube")[index];
  tubeDiv.lastElementChild.classList.add("selected");
}

function clearHighlight(){
  render();
}
</script>
</body>
</html>
