        function downloadLevelsJSON(count) {
            const status = document.getElementById('genStatus');
            status.innerText = "Generating levels, please wait...";

            // थोड़ा डिले ताकि UI फ्रीज न हो
            setTimeout(() => {
                let allLevels = {};

                for (let i = 1; i <= count; i++) {
                    let diff = i <= 20 ? 'easy' : (i <= 60 ? 'medium' : 'hard');

                    // generateWaterSortLevel आपका पिछला फंक्शन है
                    allLevels[`level_${i}`] = {
                        id: i,
                        difficulty: diff,
                        tubes: generateWaterSortLevel(diff)
                    };
                }

                // JSON को फाइल में बदलें
                const dataStr = JSON.stringify(allLevels, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);

                // एक अदृश्य लिंक बनाकर क्लिक करें
                const link = document.createElement('a');
                link.href = url;
                link.download = 'levels.json';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                status.innerText = "✅ levels.json successfully downloaded!";
            }, 100);
        }




        // डायनामिक लेवल जनरेटर (Updated)
        function generateDynamicLevel(total, full, difficulty = 'medium') {
            // 1. Initial Solved State
            let tubes = [];
            for (let i = 0; i < full; i++) {
                tubes.push(new Array(4).fill(i));
            }
            for (let i = 0; i < (total - full); i++) {
                tubes.push([]);
            }

            // 2. Shuffling logic based on difficulty
            let shuffles = difficulty === 'easy' ? 300 : (difficulty === 'medium' ? 500 : 800);

            for (let i = 0; i < shuffles; i++) {
                let src = Math.floor(Math.random() * total);
                let dst = Math.floor(Math.random() * total);
                if (src !== dst && tubes[src].length > 0 && tubes[dst].length < 4) {
                    let unit = tubes[src].pop();
                    tubes[dst].push(unit);
                }
            }

            // 3. Normalization (To ensure 'total - full' tubes are empty)
            let isNormalized = false;
            while (!isNormalized) {
                let emptyCount = 0;
                let lastTubesStart = full;
                let clean = true;

                for (let i = lastTubesStart; i < total; i++) {
                    if (tubes[i].length > 0) {
                        clean = false;
                        let color = tubes[i].pop();
                        for (let target = 0; target < full; target++) {
                            if (tubes[target].length < 4) {
                                tubes[target].push(color);
                                break;
                            }
                        }
                    }
                }
                if (clean) isNormalized = true;
            }
            return tubes;
        }

        // LocalStorage & Game Loader Logic

        // 1. डेटा लोड करें
        async function initGame() {

        // 2. मोड के हिसाब से प्रोग्रेस लोड करें

            // LocalStorage से उस स्पेसिफिक मोड का लेवल निकालें
            let savedLevel = localStorage.getItem(`progress_mode_${numTubes}`) || 1;
            let levelIndex = parseInt(savedLevel) - 1;

            renderGameUI(levelData.tubes); // UI रेंडर करें
        }

        // 3. लेवल जीतने पर प्रोग्रेस अपडेट करें

            let savedLevel = parseInt(localStorage.getItem(`progress_mode_${currentMode}`) || 1);
            let nextLevel = savedLevel + 1;

            // सिर्फ उसी मोड की प्रोग्रेस सेव करें जो अभी चल रहा है
            localStorage.setItem(`progress_mode_${currentMode}`, nextLevel);
