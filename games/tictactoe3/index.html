<!doctype html>
<html lang="hi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta property="og:title" content="Score Sharing" />
  <meta property="og:description" content="See my score!" />
  <meta property="og:image" content="https://https://rnsaraswat.github.io.vercel.app/api/og?score=500" />
  <meta property="og:type" content="website" />

  <title>Tic Tac Toe</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../../style.css">
  <style>
    body {
      display: flex;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(to right, #ff7e5f, #feb47b);
    }

    #gameArea {
      flex: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sidebar {
      width: 300px;
      background: #fff;
      border-right: 2px solid #ccc;
      padding: 20px;
      overflow-y: auto;
      height: 100vh;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #f3f1f1;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      background: #333;
      margin: 8px 0;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .muted {
      color: #bbb;
      font-size: 12px;
    }

    table,
    th,
    td {
      color: #bbb;
      border: 1px solid #d9d8d8;
      box-shadow: 0 0.5vw 2.5vw 0 rgba(0, 0, 0, 0.2);
    }

    th {
      cursor: default;
      position: relative;
      user-select: none;
    }

    .arrow {
      font-size: 14px;
      margin-left: 4px;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.2s;
    }

    .arrow:hover {
      opacity: 1;
    }

    .tic-grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 6px
    }

    .share-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .share-box {
      background: #fff;
      padding: 2vw;
      width: 30vw;
      text-align: center;
      border-radius: 1vw;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    .share-icons-group {
      display: flex;
      justify-content: space-between;
      flex-direction: column;
      margin: 1.5vw 1vw;
      padding: 1vw 1vw;
      border: 0.1vw solid black;
      border-radius: 1vw;
    }

    .share-icons {
      margin: 1.5vw 1vw;
      padding: 1vw 1vw;
      border: 0.1vw solid black;
      border-radius: 1vw;
    }

    .share-icons img {
      width: 45px;
      cursor: pointer;
    }

    #closePopup {
      padding: 8px 15px;
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Tic Tac Toe</h2>

    <div id="gameArea">
      <div id="board" class="tic-grid"></div>
    </div>
    <div style="margin-top:12px">
      <button id="reset" class="chip">Reset</button>
      <button id="local-toggle-leaderboard" class="chip">Local Leaderboard</button>
      <button id="toggle-leaderboard" class="chip">Global Leaderboard</button>
      <button class="primary" id="shareBtn">📤Sharing</button>

      <button class="primary" id="toggle-feedback">📝Feedback</button>
      <button class="primary"
        onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
      <div id="timerdisplay">⏱️ 00:00:00</div>
    </div>
    <p id="msg">Click in BOX to play</p>
    <button id="shareBtn">Share on Facebook</button>
    <button id="shareBtn1">Share on Twitter</button>
    <button id="nativeShare">Share mobile</button>
    <button id="shareBtn2">Share detect device</button>

  </div>
  <div id="leaderboardPopup" class="popupWindow">
  </div>
  <div id="localleaderboardPopup" class="popupWindow">
  </div>
  <div id="feedbackPopup" class="popupWindow"></div>
  <div id="sharePopup" class="share-popup">
    <div class="share-box">
      <h3>Share Your Score</h3>

      <div class="share-icons-group">
        <a id="twLink" target="_blank">twitter</a>
        <a id="waLink" target="_blank">whatapp</a>
        <a id="fbLink" class="share-icons" target="_blank">Facebook</a>
        <a id="tgLink" class="share-icons" target="_blank">Telegram</a>
        <a id="igLink" class="share-icons" target="_blank">Instagram</a>
        <button id="copyBtn" class="share-icons">Copy link</button>
      </div>

      <button id="closePopup">Close</button>
    </div>
  </div>

  <script type="module">
    import { shareScore } from '../../leaderboard/share.js';
    document.getElementById("shareBtn").addEventListener("click", async () => {
      shareScore("tictactoe", 0);
    });
  </script>
  <script type="module">
    import { renderLeaderboard, saveScore, sortTable } from '../../leaderboard/leaderboard.js';

    window.sortTable = sortTable;
    window.submitScore = async function (player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at) {
      try {
        await saveScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);
      } catch (e) {
        document.getElementById("msg").textContent = 'Error saving score in global leaderboard:' + e;
      }
    };
    document.addEventListener('DOMContentLoaded', () => {
      renderLeaderboard('tictactoe');
    });
  </script>

  <script type="module">
    import { localrenderLeaderboard, saveToLeaderboard } from '../../leaderboard/localleaderboard.js';
    document.addEventListener('DOMContentLoaded', () => {
      localrenderLeaderboard('tictactoe');
    });
  </script>

  <script>
    function hideFeedback() {
      document.getElementById("feedbackPopup").style.display = 'none';
    };

    function hideLB() {
      document.getElementById("leaderboardPopup").style.display = 'none';
    };

    function hideLLB() {
      document.getElementById("localleaderboardPopup").style.display = 'none';
    };

    function clearLLB() {
      if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
        localStorage.removeItem('leaderboard');
        alert("All games Local Leaderboard Data is Cleared");
        textToSpeechEng('Local Leaderboard data cleared');
      }
    };

    fetch('../../leaderboard/leaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('leaderboardPopup').innerHTML = htmlText;
      });

    fetch('../../leaderboard/localleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('localleaderboardPopup').innerHTML = htmlText;
      });

    fetch('../../leaderboard/feedback.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('feedbackPopup').innerHTML = htmlText;
      });

    document.getElementById("leaderboardPopup").style.display = 'none';
    document.getElementById("localleaderboardPopup").style.display = 'none';
    document.getElementById("feedbackPopup").style.display = 'none';

    document.getElementById("toggle-leaderboard").addEventListener("click", () => {
      if (document.getElementById("toggle-leaderboard").style.display === 'block') {
        document.getElementById("leaderboardPopup").style.display = 'none';
      } else {
        document.getElementById("leaderboardPopup").style.display = 'block';
        loadCSS()
      }
    });

    document.getElementById("local-toggle-leaderboard").addEventListener("click", () => {
      if (document.getElementById("leaderboardPopup").style.display === 'block') {
        document.getElementById("localleaderboardPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("localleaderboardPopup").style.display = 'block';
        loadCSS();
      }
    });

    document.getElementById("toggle-feedback").addEventListener("click", () => {
      if (document.getElementById("feedbackPopup").style.display === 'block') {
        document.getElementById("feedbackPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("feedbackPopup").style.display = 'block';
        loadfeedbakCSS();
      }
    });

    function loadfeedbakCSS() {
      var head = document.head;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = '../../leaderboard/feedback.css';
      head.appendChild(link);
    }

    function loadCSS() {
      var head = document.head;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = '../../leaderboard/leaderboard.css';
      head.appendChild(link);
    }

    window.onload = function () {
      loadCSS();
      loadfeedbakCSS();
    };

    (async () => {
      const GAME_NAME = "TIC TAC TOE";
      const GAME_SHORT = "tictactoe";

      const res = await fetch("../../manifest.json");
      const manifest = await res.json();

      manifest.short_name = GAME_SHORT;
      manifest.name = GAME_NAME;

      manifest.start_url = 'https://rnsaraswat.github.io/games/games/tictactoe3/index.html';
      manifest.scope = 'https://rnsaraswat.github.io/games/games/tictactoe3/index.html';

      // 🔥 icons ko absolute banane ka safety fix
      manifest.icons = manifest.icons.map(icon => ({
        ...icon,
        src: new URL(icon.src, location.origin).href
      }));

      const blob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);
    })();
  </script>

  <script type="module">
    import { shareScore } from '../../leaderboard/share.js';
    import { localrenderLeaderboard, saveToLeaderboard } from '../../leaderboard/localleaderboard.js';
    let gameName = 'tictactoe';
    let score = 0;

    const boardEl = document.getElementById('board');
    let board = Array(9).fill(null), turn = 'X', over = false, moves = 0, startTime, currenttime, elapsed = 0;
    function render() {
      boardEl.innerHTML = board.map((c, i) => `<button class="cell">${c || ''}</button>`).join(''); document.querySelectorAll('.cell').forEach((el, i) => el.addEventListener('click', () => play(i)));
    }
    function play(i) {
      if (moves < 1) { startTime = new Date(); }
      if (over || board[i]) return;
      board[i] = turn; moves++; check(); if (!over) { aiMove(); } render();
    }
    function aiMove() { const empties = board.map((v, i) => v ? null : i).filter(x => x !== null); if (empties.length === 0) return; const pick = empties[Math.floor(Math.random() * empties.length)]; board[pick] = 'O'; moves++; check(); }
    function check() {
      const wins = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
      for (const w of wins) {
        const [a, b, c] = w;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          over = true;
          currenttime = new Date();

          elapsed = Math.floor((currenttime - startTime) / 1000);
          const winner = board[a];
          document.getElementById("msg").textContent = "winner is " + winner;
          score = 9 * 10 - moves * 2 + 50;
          setTimeout(() => onGameOver(winner, winner === 'X' ? 100 : 50), 100);
          shareScore(gameName, score);
          return;
        }
      }
      if (board.every(Boolean)) {
        over = true;
        currenttime = new Date();
        elapsed = Math.floor((currenttime - startTime) / 1000);
        winner = 'draw';
        document.getElementById("msg").textContent = "its a Draw"
        score = 9 * 10 - moves * 2 + 100;
        setTimeout(() => onGameOver(winner, 0));
      }
    }
    function onGameOver(winner) { // higher better

      if (winner === 'draw') return;
      let player_name = localStorage.getItem('player_name');
      let email = localStorage.getItem('email') || "-";
      let player_opponent = localStorage.getItem('player_opponent') || 'computer';
      let game_id = gameName;
      let size = '3x3';
      let filed1 = 0;
      let filed2 = 0
      let filed3 = "-";
      let filed4 = "-";
      let difficulty = 'easy';
      const created_at = new Date();

      saveToLeaderboard(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);

      window.submitScore && window.submitScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);
    }
    document.getElementById('reset').addEventListener('click', () => { board = Array(9).fill(null); over = false; moves = 0; render(); });
    render();


  </script>

      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then(() => console.log("SW registered"))
          .catch((err) => console.log("SW error", err));
      });
    }
  </script>
