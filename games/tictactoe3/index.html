    // to add firebase leaderboard (save record)
    window.saveScore = async function () {
      text = `Black=${b}, White=${w}`

      try {

          game_id: game_id || 'tictactoe',
          game: game || 'tictactoe',
          name: winnerName || 'Guast',
          opponent: opponent || "Computer",
          difficulty: difficulty || "-",
          size: size || `8x8`,
          elapsed: Math.floor(Number(elapsedTime) / 1000) || 0,
          score: score || 0,
          moves: history.length || 0,
          email: email || "-",
          level: "-",
          mode: playMode || 'pvc',
          text: text || "-",
          createdAt: new Date()
        });
        console.log("Score Saved!");
      } catch (error) {
        console.error("Error:", error);
      }
    };

    // to add firebase leaderboard (save record)
    function updateleaderboard() {
      let opponent = "Computer";
      let game_id = 'tictactoe';
      let gsize = `9x9`;
      let elapsed = Math.floor(Number(elapsedTime) / 1000);
      let gameCount = history.length;
      let filed1 = 0;
      let filed2 = 0
      let filed3 = `Black=${b}, White=${w}`;
      let filed4 = playMode || 'pvc';
      let email = localStorage.getItem('email') || '-';
      const created_at = new Date();
      if (depth == 2) {
        score = (9 * 9 * 100 + (b - w > 0 ? b - w : w - b) - Math.floor(Number(elapsedTime) / 1000)) * 1;
        difficulty = "easy";
      } else if (depth == 4) {
        score = (9 * 9 * 100 + (b - w > 0 ? b - w : w - b) - Math.floor(Number(elapsedTime) / 1000)) * 2;

    (async () => {
      const GAME_NAME = "TIC TAC TOE";
      const GAME_SHORT = "tictactoe";

      const res = await fetch("../../manifest.json");
      const manifest = await res.json();

      manifest.short_name = GAME_SHORT;

      // 🔥 icons ko absolute banane ka safety fix
      manifest.icons = manifest.icons.map(icon => ({
        ...icon,
        src: new URL(icon.src, location.origin).href
      }));

      const blob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);

  <script type="module">
    window.gameName = 'tictactoe';
    window.game = `Tic Tac Toe`
    window.score = 0;
    window.shareLink = `https://rnsaraswat.github.io/games/games/${gameName}/index.html`
    window.winner;

    const boardEl = document.getElementById('board');
    let board = Array(9).fill(null), turn = 'X', over = false, moves = 0, startTime, currenttime, elapsed = 0;
    function render() {
      boardEl.innerHTML = board.map((c, i) => `<button class="cell">${c || ''}</button>`).join(''); document.querySelectorAll('.cell').forEach((el, i) => el.addEventListener('click', () => play(i)));
    }
    function play(i) {
      if (moves < 1) { startTime = new Date(); }
      if (over || board[i]) return;
      board[i] = turn; moves++; check(); if (!over) { aiMove(); } render();
    }
    function aiMove() { const empties = board.map((v, i) => v ? null : i).filter(x => x !== null); if (empties.length === 0) return; const pick = empties[Math.floor(Math.random() * empties.length)]; board[pick] = 'O'; moves++; check(); }
    function check() {
      const wins = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
      for (const w of wins) {
        const [a, b, c] = w;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          over = true;
          currenttime = new Date();

          elapsed = Math.floor((currenttime - startTime) / 1000);
          window.winner = board[a];
          document.getElementById("msg").textContent = "winner is " + winner;
          score = 9 * 10 - moves * 2 + 50;
          setTimeout(() => onGameOver(winner, winner === 'X' ? 100 : 50), 100);
          // window.shareScoreCommon(gameName, score);
          // window.detectDevicePara();
          window.handleWin();

          return;
        }
      }
      if (board.every(Boolean)) {
        over = true;
        currenttime = new Date();
        elapsed = Math.floor((currenttime - startTime) / 1000);
        winner = 'draw';
        document.getElementById("msg").textContent = "its a Draw"
        score = 9 * 10 - moves * 2 + 100;
        setTimeout(() => onGameOver(winner, 0));
      }
    }
    function onGameOver(winner) { // higher better

      if (winner === 'draw') return;
      let player_name = localStorage.getItem('player_name');
      let email = localStorage.getItem('email') || "-";
      let player_opponent = localStorage.getItem('player_opponent') || 'computer';
      let game_id = gameName;
      let size = '3x3';
      let filed1 = 0;
      let filed2 = 0
      let filed3 = "-";
      let filed4 = "-";
      let difficulty = 'easy';
      const created_at = new Date();

        // to add local leaderboard (save record)
        lcsaveToLeaderboard(winnerName, opponent, email, gsize, difficulty, game_id, score, elapsed, gameCount, filed1, filed2, filed3, filed4, created_at)

      window.submitScore && window.submitScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);

    }

    document.getElementById('reset').addEventListener('click', () => { board = Array(9).fill(null); over = false; moves = 0; render(); });
    render();

  </script>



  <script>



    function isMobile() {
      // return (
      //   navigator.share &&
      //   /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      // );

      const ua = navigator.userAgent;
      if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
        return "Tablet";
      }
      if (/Mobile|iP(hone|od)|Android|BlackBerry|IEMobile|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) {
        return "Mobile";
      }
      return "Desktop";
    }

    async function shareMobile(gameName, score, shareLink, logoUrl) {

      console.log("shareScore", gameName, score);

      const siteName = "Ravindra Games Hub";
      const gameLink = `https://rnsaraswat.github.io/games/games/${gameName}/index.html`;

      const textToShare =
        `${siteName}
${gameName}
Can you beat my Score: ${score}

Play here:
${gameLink}`;

      console.log("gamelink", gameLink);
      const imageUrl = "../../assets/icons/maskable-icon.png";

      try {
        await navigator.share({
          title: siteName,
          text: textToShare
        });
        console.log("try", gameLink);

        const blob = await (await fetch(imageUrl)).blob();
        const file = new File([blob], "../../assets/icons/maskable-icon.png", { type: "image/png" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file]
          });
          console.log("navigator.canShare && navigator.canShare", file, blob);
        }

      } catch (err) {
        console.log("Share cancelled or failed", err);
      }

    }

    // Desktop JS Logic
    let SHARE_DATA = {};

    function openDesktopShare(gameName, score, shareLink) {
      SHARE_DATA = { gameName, score, shareLink };

      document.getElementById("shareGame").innerText = gameName;
      document.getElementById("shareScore").innerText = "Score: " + score;
      document.getElementById("sharePopup").classList.remove("hidden");
    }

    function closeShare() {
      document.getElementById("sharePopup").classList.add("hidden");
    }

    function shareWhatsApp() {
      open(
        `https://wa.me/?text=${encodeURIComponent(
          `${SHARE_DATA.gameName} | Score: ${SHARE_DATA.score}\n${SHARE_DATA.shareLink}`
        )}`
      );
    }

    function shareTwitter() {
      open(
        `https://twitter.com/intent/tweet?text=${encodeURIComponent(
          `${SHARE_DATA.gameName} | Score: ${SHARE_DATA.score}`
        )}&url=${encodeURIComponent(SHARE_DATA.shareLink)}`
      );
    }

    function shareFacebook() {
      open(
        `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(
          SHARE_DATA.shareLink
        )}`
      );
    }

    function copyLink() {
      navigator.clipboard.writeText(SHARE_DATA.shareLink);
      alert("Link copied!");
    }


    // FINAL MERGED handleWin() (🔥 MOST IMPORTANT)
    // async function window.handleWin(gameName, score) {
    window.handleWin = async function () {
      // await launchConfetti(); // ⏳ wait until animation ends

      const link = "https://rnsaraswat.github.io/games/";
      // const logo = "images/RGHlogo.jpg";
      const logo = '../../assets/icons/RGHlogo.png';

      if (isMobile() == "Mobile" || isMobile() == "Tablet") {
        await shareMobile(gameName, score, link, logo);
      } else if (isMobile() == "Desktop") {
        openDesktopShare(gameName, score, link);
      } else {
        await shareMobile(gameName, score, link, logo);
      }
    }

  </script>
