    body {
      display: flex;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      /* background: #222; */
      color: #fff;
      /* background: #d8d9f8; */

    }

    #gameArea {
      flex: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sidebar {
      width: 300px;
      background: #fff;
      border-right: 2px solid #ccc;
      padding: 20px;
      overflow-y: auto;
      height: 100vh;
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #f3f1f1;

    .score-row {
      display: flex;
      justify-content: space-between;
      background: #333;
      margin: 8px 0;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .muted {
      color: #bbb;
      font-size: 12px;
    }

    table,
    th,
    td {
      color: #bbb;
      border: 1px solid #d9d8d8;
      box-shadow: 0 0.5vw 2.5vw 0 rgba(0, 0, 0, 0.2);
    }

    th {
      cursor: default;
      position: relative;
      user-select: none;
    }

    .arrow {
      font-size: 14px;
      margin-left: 4px;
      cursor: pointer;
      opacity: 0.3;
      transition: opacity 0.2s;
    }

    .arrow:hover {
      opacity: 1;
    }

    .tic-grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 6px
    }

    /* CSS code for share link/button for browser and mobile */

    .share-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .share-box {
      background: #fff;
      padding: 2vw;
      width: 30vw;
      text-align: center;
      border-radius: 1vw;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);

      justify-content: space-between;
      flex-direction: column;
      margin: 1.5vw 1vw;
      padding: 1vw 1vw;
      border: 0.1vw solid black;
      border-radius: 1vw;
    }

    .share-icons {
      margin: 1.5vw 1vw;
      padding: 1vw 1vw;
      border: 0.1vw solid black;
      border-radius: 1vw;
    }

    .share-icons img {
      width: 45px;
      cursor: pointer;
    }

    #closePopup {
      padding: 8px 15px;
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
    }

  <script>
    fetch('../../leaderboard/leaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('leaderboardPopup').innerHTML = htmlText;

    fetch('../../leaderboard/localleaderboard.html')

      if (document.getElementById("toggle-leaderboard").style.display === 'block') {
        document.getElementById("leaderboardPopup").style.display = 'none';
      } else {
        document.getElementById("leaderboardPopup").style.display = 'block';
        loadCSS()
      }
    });

    document.getElementById("local-toggle-leaderboard").addEventListener("click", () => {
      if (document.getElementById("leaderboardPopup").style.display === 'block') {
        document.getElementById("localleaderboardPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("localleaderboardPopup").style.display = 'block';
        loadCSS();
      }
    });

    document.getElementById("toggle-feedback").addEventListener("click", () => {
            if (document.getElementById("feedbackPopup").style.display === 'block') {
                document.getElementById("feedbackPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("feedbackPopup").style.display = 'block';
                loadfeedbakCSS();
            }
        });

        function loadfeedbakCSS() {
            var head = document.head;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = './leaderboard/feedback.css';
            head.appendChild(link);
        }

    function loadCSS() {
      var head = document.head;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = '../../leaderboard/leaderboard.css';
      head.appendChild(link);
    }

    window.onload = function () {
            loadCSS();
            loadfeedbakCSS();
        };
  </script>

  <script  type="module">
    score;

    // Minimal TicTacToe: human vs AI (random)
    const boardEl = document.getElementById('board');
    let board = Array(9).fill(null), turn = 'X', over = false, moves = 0, startTime, currenttime, elapsed = 0;
    function render() {
      boardEl.innerHTML = board.map((c, i) => `<button class="cell">${c || ''}</button>`).join(''); document.querySelectorAll('.cell').forEach((el, i) => el.addEventListener('click', () => play(i)));
    }
    function play(i) {
      if (moves < 1) { startTime = new Date(); }
      if (over || board[i]) return;
      board[i] = turn; moves++; check(); if (!over) { aiMove(); } render();
    }
    function aiMove() { const empties = board.map((v, i) => v ? null : i).filter(x => x !== null); if (empties.length === 0) return; const pick = empties[Math.floor(Math.random() * empties.length)]; board[pick] = 'O'; moves++; check(); }
    function check() {
      const wins = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
      for (const w of wins) {
        const [a, b, c] = w;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          over = true;
          currenttime = new Date();

          elapsed = Math.floor((currenttime - startTime) / 1000);
          const winner = board[a];
          document.getElementById("msg").textContent = "winner is " + winner;
          setTimeout(() => onGameOver(winner, winner === 'X' ? 100 : 50), 100);
          return;
        }
      }
      if (board.every(Boolean)) {
        over = true;
        currenttime = new Date();
        elapsed = Math.floor((currenttime - startTime) / 1000);
        winner = 'draw';
        document.getElementById("msg").textContent = "its a Draw"
        setTimeout(() => onGameOver(winner, 0), 100);
      }

      let filed1 = 0;

      let filed3 = "-";

    }
    document.getElementById('reset').addEventListener('click', () => { board = Array(9).fill(null); over = false; moves = 0; render(); });
    render();

  <script>
    /* javascript code for share link/button for browser and mobile */

    // Detect Mobile Browser
    function isMobile() {
      return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
    }

    // document.getElementById("shareBtn2").addEventListener("click", async () => {
      const score = 420;
      const shareText = `I scored ${score} points! Try to beat me!`;
      const shareURL = "https://yourdomain.com/share.html?score=" + score;

      // --------------------------
      // 📱 MOBILE SHARE
      // --------------------------
      if (isMobile() && navigator.share) {
        try {
          await navigator.share({
            title: "My Score",
            text: shareText,
            url: shareURL
          });
          return;
        } catch (e) { }
      }

      // --------------------------
      // 💻 DESKTOP SHARE POPUP
      // --------------------------

      // Encode
      const t = encodeURIComponent(shareText);
      const u = encodeURIComponent(shareURL);

      // Twitter
      document.getElementById("twLink").href =
        `https://twitter.com/intent/tweet?text=${t}&url=${u}`;

      // WhatsApp Web
      document.getElementById("waLink").href =
        `https://web.whatsapp.com/send?text=${t}%20${u}`;

      // Facebook Share
      document.getElementById("fbLink").href =
        `https://www.facebook.com/sharer/sharer.php?u=${u}`;

      // Telegram Web
      document.getElementById("tgLink").href =
        `https://t.me/share/url?url=${u}&text=${t}`;

      // // Instagram (guide to direct message)
      document.getElementById("igLink").href =
        `https://www.instagram.com/direct/inbox/`;

      // Show Popup
      document.getElementById("sharePopup").style.display = "flex";
    // });

    document.getElementById("closePopup").addEventListener("click", () => {
      document.getElementById("sharePopup").style.display = "none";
    });
  </script>
