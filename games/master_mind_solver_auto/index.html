<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastermind Solver by Computer Automatic</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#6200ee" />
</head>

<body>
    <div id="container">
        <!-- Left Panel -->
        <div id="left" class="section">
            <h1>Mastermind Solver</h1>
            <div class="button-group">
                <div class="button-group" style="border: 0.1vw solid var(--border);">
                    <label for="slots">No of Slots:
                        <input type="number" id="slots" min="1" max="12" value="4">
                    </label>
                    <label for="colors">No of Colors:
                        <input type="number" id="colors" min="1" max="20" value="6">

                    </label>
                    <label id="allowedDuplicates">Allow Duplicate Colors
                        <input type="checkbox" id="buttonDuplicate" checked>
                    </label>
                    <button id="resetSecret" class="btn ghost">Reset secret</button>
                    <button id="randomSecret" class="btn">Random secret</button>
                </div>
                <button class="primary" id="startSolve" class="btn">Start solver</button>
                <button id="toggle-theme">☀️ Light</button>
                <button id="toggle-sound">🔇 Music:Off"</button>
                <button class="primary" id="shareBtn">📤Sharing</button>

                <button class="primary" id="toggle-feedback">📝Feedback</button>
                <button class="primary"
                    onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
                <div id="timerdisplay">⏱️ 00:00:00</div>
                <div class="message" id="output">
                    Please Click on slot to select/change your secreate colors and press Start solver
                </div>
            </div>
        </div>
        <!-- Right Grid -->
        <div id="right">
            <div class="board" id="secretBoard"></div>
            <div>
                <div class="small">Color palette (click on slot to select/change secreate colors)</div>
                <div class="palette" id="palette"></div>
            </div>
            <div id="visualGuesses"></div>

            <div class="log" id="log"></div>
        </div>
    </div>
    <div id="feedbackPopup" class="popupWindow"></div>
    <script type="module" src="js/script.js"></script>
    <script type="module">
        import { shareScore } from '../../leaderboard/share.js';
        document.getElementById("shareBtn").addEventListener("click", async () => {
            shareScore("5inARow", 0);
        });
    </script>
    <script>
        function hideFeedback() {
            document.getElementById("feedbackPopup").style.display = 'none';
        };

        fetch('../../leaderboard/feedback.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('feedbackPopup').innerHTML = htmlText;
            });

        document.getElementById("feedbackPopup").style.display = 'none';

        document.getElementById("toggle-feedback").addEventListener("click", () => {
            if (document.getElementById("feedbackPopup").style.display === 'block') {
                document.getElementById("feedbackPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("feedbackPopup").style.display = 'block';
                loadfeedbakCSS();
            }
        });

        function loadfeedbakCSS() {
            var head = document.head;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = '../../leaderboard/feedback.css';
            head.appendChild(link);
        }

        window.onload = function () {
            loadfeedbakCSS();
        };

        (async () => {
            const GAME_NAME = "Mastermind Solver Auto";
            const GAME_SHORT = "mastermindsolver";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/master_mind_solver_auto/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/master_mind_solver_auto/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./sw.js")
                    .then(() => console.log("SW registered"))
                    .catch((err) => console.log("SW error", err));
            });
        }
    </script>
</body>

</html>
