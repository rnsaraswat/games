    <script>
        document.getElementById("gb-feedbackModal").style.display = 'none';
        document.getElementById("lcLeaderboardModal").style.display = 'none';
        document.getElementById("gbLeaderboardModal").style.display = 'none';
        document.getElementById("firebasegbLeaderboardModal").style.display = 'none';
        // document.getElementById("winText").style.display = 'none';
        document.getElementById("pauseOverlay").style.display = 'none';
        document.getElementById("rulesPopup").style.display = 'none';

        const themeToggle = document.getElementById('toggle-theme');
        function setTheme(t) {
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '☀️ Light'
            }
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '🌙 Dark'
            }
        }
        if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
        setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

        function openGlobalLeaderboard() {
            document.getElementById("gbLeaderboardModal").style.display = 'flex';
        };

        function closeGlobalLeaderboard() {
            document.getElementById("gbLeaderboardModal").style.display = 'none';
        };

        function openFirebaseGlobalLeaderboard() {
            document.getElementById("firebasegbLeaderboardModal").style.display = 'flex';
        };

        function closeFirebaseGlobalLeaderboard() {
            document.getElementById("firebasegbLeaderboardModal").style.display = 'none';
        };

        fetch('../../leaderboard/firebasegbleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('firebasegbLeaderboardModal').innerHTML = htmlText;
                document.getElementById("firebasegbLeaderboardModal").style.display = 'none';
            });

        fetch('../../leaderboard/gbleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('gbLeaderboardModal').innerHTML = htmlText;
                document.getElementById("gbLeaderboardModal").style.display = 'none';
            });

        function openLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'flex';
        };

        function closeLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'none';
        };

        function clearLLB() {
            if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
                localStorage.removeItem('leaderboard');
                alert("All games Local Leaderboard Data is Cleared");
                textToSpeechEng('Local Leaderboard data cleared');
            }
        };

        fetch('../../leaderboard/lcleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
                document.getElementById("lcLeaderboardModal").style.display = 'none';
            });

        function openGlobalFeedback() {
            document.getElementById("gb-feedbackModal").style.display = 'flex';
        };

        function closeGlobalFeedback() {
            document.getElementById("gb-feedbackModal").style.display = 'none';
        };

        fetch('../../leaderboard/gbfeedback.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('gb-feedbackModal').innerHTML = htmlText;
                document.getElementById("gb-feedbackModal").style.display = 'none';
            });

        (async () => {
            const GAME_NAME = "Jigsaw Puzzle";
            const GAME_SHORT = "jigsaw";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/jigsaw1/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/jigsaw1/index.html';

            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();

    </script>
    <script>

        const board = document.getElementById("board")
        let image = new Image()

        let rows = 4
        let cols = 6

        let pieces = []
        let pieceW, pieceH

        let placed = 0

        let timer = 0
        let timerInterval = null

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++
                updateTimer()
            }, 1000)
        }

        function stopTimer() {
            clearInterval(timerInterval)
        }

        function updateTimer() {
            let h = Math.floor(timer / 3600)
            let m = Math.floor(timer % 3600 / 60)
            let s = timer % 60

            document.getElementById("timer-display").innerText =
                String(h).padStart(2, "0") + ":" +
                String(m).padStart(2, "0") + ":" +
                String(s).padStart(2, "0")
        }

        /* start puzzle */
        function startPuzzle() {
            let diff = document.getElementById("difficulty").value.split("x")
            rows = parseInt(diff[0])
            cols = parseInt(diff[1])

            createPieces()

            shufflePieces()

            timer = 0
            startTimer()
        }

        /* create pieces */
        function createPieces() {
            board.innerHTML = ""

            pieces = []

            let w = board.clientWidth
            let h = board.clientHeight

            pieceW = w / cols
            pieceH = h / rows

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {

                    let canvas = document.createElement("canvas")

                    canvas.width = pieceW
                    canvas.height = pieceH

                    canvas.className = "piece"

                    let ctx = canvas.getContext("2d")

                    let sx = c * (image.width / cols)
                    let sy = r * (image.height / rows)

                    ctx.drawImage(
                        image,
                        sx, sy,
                        image.width / cols,
                        image.height / rows,
                        0, 0,
                        pieceW, pieceH
                    )

                    canvas.style.width = pieceW + "px"
                    canvas.style.height = pieceH + "px"

                    board.appendChild(canvas)

                    let piece = {
                        r, c,
                        x: 0, y: 0,
                        correctX: c * pieceW,
                        correctY: r * pieceH,
                        el: canvas,
                        placed: false
                    }

                    enableDrag(piece)

                    pieces.push(piece)
                }
            }
        }

        /* shuffle */
        function shufflePieces() {
            pieces.forEach(p => {
                if (p.placed) return

                p.x = Math.random() * (board.clientWidth - pieceW)
                p.y = Math.random() * (board.clientHeight - pieceH)

                p.el.style.transform = `translate(${p.x}px,${p.y}px)`
            })
        }

        /* drag */
        function enableDrag(piece) {
            let dragging = false
            let ox, oy

            piece.el.onpointerdown = e => {
                dragging = true
                ox = e.clientX - piece.x
                oy = e.clientY - piece.y
            }

            window.onpointermove = e => {
                if (!dragging) return

                piece.x = e.clientX - ox
                piece.y = e.clientY - oy

                piece.el.style.transform =
                    `translate(${piece.x}px,${piece.y}px)`
            }

            window.onpointerup = () => {
                dragging = false

                let dx = Math.abs(piece.x - piece.correctX)
                let dy = Math.abs(piece.y - piece.correctY)

                if (dx < 20 && dy < 20) {

                    piece.x = piece.correctX
                    piece.y = piece.correctY

                    piece.el.style.transform =
                        `translate(${piece.x}px,${piece.y}px)`

                    piece.placed = true

                    placed++

                    updateStatus()

                    if (placed === pieces.length) {
                        stopTimer()
                        confetti()
                    }
                }
            }
        }

        /* status */
        function updateStatus() {
            document.getElementById("status").innerText =
                "Placed " + placed + " / " + pieces.length
        }

        /* pause */
        document.getElementById("pauseBtn").onclick = () => {
            stopTimer()
            document.getElementById("pauseOverlay").style.display = "flex"
        }
        /* resume */
        document.getElementById("resumeBtn").onclick = () => {
            startTimer()
            document.getElementById("pauseOverlay").style.display = "none"
        }

        /* start */
        // document.getElementById("startBtn").onclick = startPuzzle

        // document.getElementById("resetBtn").onclick = () => {
        //     placed = 0
        //     startPuzzle()
        // }

        /* gallery */
        document.querySelectorAll(".gallery img").forEach(img => {
            img.onclick = () => {
                image.src = img.src
            }
        })

        /* load url */
        document.getElementById("loadURLBtn").onclick = () => {
            image.src = document.getElementById("imgURL").value
        }

        /* local image */
        document.getElementById("localImg").onchange = e => {
            let file = e.target.files[0]
            image.src = URL.createObjectURL(file)
        }

        /* hint */
        document.getElementById("hint").onchange = e => {
            let v = e.target.value

            board.style.backgroundImage = "url(" + image.src + ")"
            board.style.backgroundSize = "cover"
            board.style.opacity = 1

            board.style.backgroundBlendMode = "normal"

            board.style.backgroundColor = "rgba(0,0,0," + (1 - v) + ")"
        }

        /* confetti */
        function confetti() {
            for (let i = 0; i < 150; i++) {
                let div = document.createElement("div")

                div.style.position = "fixed"
                div.style.width = "6px"
                div.style.height = "6px"
                div.style.background = "hsl(" + Math.random() * 360 + ",100%,50%)"
                // div.style.backgroundColor = '#0ff'
                div.style.boxShadow = "0 0 5px #0ff, 0 0 10px #0ff";

                div.style.left = Math.random() * 100 + "vw"
                div.style.top = "-10px"

                div.style.animation = "fall 3s linear"

                document.body.appendChild(div)

                setTimeout(() => div.remove(), 2000)
            }
        }
    </script>
