    <style>
        #container {
            display: flex;
            flex-direction: row;
            padding: 0.1vw;
        }

        .section {
            box-sizing: border-box;
            padding: 1vw;
            overflow: hidden;
        }

        #left {
            background: var(--bg);
            padding: 0.1vw;

            align-items: center;

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 10px;
            width: 100%;
        }

        .scoreboard {
            margin-top: 1vh;
        }

        select:hover {
            background: var(--bg-hover);
        }

        input:hover {
            background: var(--bg-hover);
        }

        button:hover {
            background: var(--bg-hover);
        }

        button.primary {
            gap: 0.8vw;
            align-items: center;
            flex-wrap: wrap;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            padding: 1vw 1.2vw;
            margin: 1vw 0.2vw 0.5vw 0.2vw;
            font-size: 1.6vw;
            display: inline-block;
            margin-top: 0.1vh;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
            border-radius: 0.5vw;
            background: linear-gradient(90deg, #9762f1, #7c3aed);
            color: #fff;
            border-color: transparent;
            background: linear-gradient(180deg, #10b981, #059669);
            border: none;
            box-shadow: 0 1vw 4vw var(--box-shadow);
        }

        button.primary:hover {
            opacity: 0.6;
        }

        #message {
            width: 100%;
            text-align: center;
            background: var(--bg);
            margin-top: 1vh;
            margin-bottom: 1vh;
            padding: 1vw;
            border: 0.3vw dashed var(--box-shadow);
            color: var(--text);
            font-weight: bold;
            font-size: 1.5vw;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
        }

        #right {
            background: var(--bg);
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0.1vw;
            justify-content: center;
        }

        #board {
            aspect-ratio: 1/1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.2vw;
            margin: 0 auto;
        }

        .cell.disabled {
            pointer-events: none;
            color: #888;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-repeat: no-repeat;
            background-size: 200% 100%;
            font-size: 0;
            border: 0.2vw solid var(--text);
            background-color: var(--cell-bg);
            background-position: center center;
        }

        .cell.x {
            background-image: url("../../assets/images/tic_tac_toe_X_O.png");
            background-position: 0% 50%;
        }

        .cell.o {
            background-image: url("../../assets/images/tic_tac_toe_X_O.png");
            background-position: 100% 50%;
        }


        @keyframes color {
            0% {
                font-size: 8.2vw;
            }

            50% {
                font-size: 8.1vw;
            }

            100% {
                font-size: 8vw;
            }
        }

        #timer-display {
            font-family: 'Digital', Arial, Helvetica, sans-serif;
            text-align: center;
            width: 100%;
            height: auto;
            font-size: 15px;
            padding: 5px 5px;
            margin: 5px 2px 5px 2px;
            background: var(--bg);
            color: var(--text);
            border: none;
        }

        /* 🧭 Portrait (Top-Bottom layout) */
        @media (max-aspect-ratio: 1/1) {
            #container {
                flex-direction: column;
            }

            #left {
                width: 100%;
                max-width: 100%;
                flex: 0 0 auto;
            }

            #right {
                flex: 1;
                width: 100%;
            }

            .button-group {
                gap: 5px;
            }

            button.primary {
                padding: 1vw 2vw;
                margin: 1vw 0.5vw 0.1vw 0.5vw;
                font-size: 3vw;
            }

            #timer-display {
                font-size: 3vw;
            }

            #message {
                font-size: 3vw;
            }
        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        #winText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: gold;
            text-shadow: 2px 2px 10px #fff;
            font-weight: bold;
            opacity: 0;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        .name-main-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;

            width: 60%;
            height: 30%;
            border: 2px solid #333;
            z-index: 10;
            background: var(--bg);
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        .name-top-section {
            width: 100%;
            padding: 8px;
            border-radius: 2px;
            color: white;
            text-align: center;
        }

        .name-mid-section {
            flex: 1;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: stretch;
            justify-content: center;
            gap: 10px;
        }

        .name-footer-section {

        .name-primary-button {

            margin: 0px;
            transition: background-color 0.3s, transform 0.2s;

        /* Modal CSS (common CSS file में) */

        .modal-content {

            overflow-y: auto;
            padding: 20px;
            border-radius: 12px;
        }

        .close {
            float: right;
            cursor: pointer;
        }

    <script>
        // function openLeaderboard() {
        //     document.getElementById("leaderboardModal").style.display = 'flex';
        // };
        document.getElementById("FB-feedbackModal").style.display = 'none';
        document.getElementById("lcLeaderboardModal").style.display = 'none';
        document.getElementById("firebaseLeaderboardModal").style.display = 'none';
        // document.getElementById("leaderboardModal").style.display = 'none';
        document.getElementById("winText").style.display = 'none';
        // document.getElementById("rulesPopup").style.display = 'none';

        const themeToggle = document.getElementById('toggle-theme');
        function setTheme(t) {
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '☀️ Light'
            }
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '🌙 Dark'
            }
        }
        if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
        setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

        // to add firebase leaderboard (display & hide)
        function openFirebaseGlobalLeaderboard() {
            document.getElementById("firebaseLeaderboardModal").style.display = 'flex';
        };

        function closeFirebaseGlobalLeaderboard() {
            document.getElementById("firebaseLeaderboardModal").style.display = 'none';
        };

        fetch('../../leaderboard/firebasegbleaderboard.html')
    .then(response => response.text())
            .then(htmlText => {
                document.getElementById('firebaseLeaderboardModal').innerHTML = htmlText;
                document.getElementById("firebaseLeaderboardModal").style.display = 'none';

                setTimeout(() => {
                    console.log("window.initLeaderboard =", window.initLeaderboard);
                    if (window.initLeaderboard) {
                        window.initLeaderboard();
                    } else {
                        console.error("initLeaderboard not found");
                    }
                }, 500);
            });

        // to add local leaderboard (display & hide)
        function openLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'flex';
        };

        function closeLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'none';
        };

        function clearLLB() {
            if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
                localStorage.removeItem('leaderboard');
                alert("All games Local Leaderboard Data is Cleared");
                textToSpeechEng('Local Leaderboard data cleared');
            }
        };

        fetch('../../leaderboard/lcleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
                document.getElementById("lcLeaderboardModal").style.display = 'none';
            });
            function openFBFeedbackV2() {
            const modal = document.getElementById("FB-feedbackModal");
            if (!modal) {
                console.error("FB-feedbackModal not found");
                return;
            }
            modal.style.display = "flex";
        }

        function closeFBFeedback() {
            const modal = document.getElementById("FB-feedbackModal");
            if (!modal) return;
            modal.style.display = "none";
        }

        fetch('../../leaderboard/feedback.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Feedback HTML load failed: " + response.status);
                }
                return response.text();
            })
            .then(htmlText => {
                const modal = document.getElementById("FB-feedbackModal");
                if (!modal) {
                    console.error("FB-feedbackModal not found");
                    return;
                }
                modal.innerHTML = htmlText;
                modal.style.display = "none";
            })
            .catch(error => {
                console.error("Feedback V2 load error:",error);
            });

        (async () => {
            const GAME_NAME = "TIC TAC TOE";
            const GAME_SHORT = "tictactoe";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/tictactoe/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/tictactoe/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();

    </script>
