<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sudoku Solver</title>
    <meta name="description"
        content="Ravindra Games Hub — collection of lightweight web games (Sudoku Solver) Solve number game in squre">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../leaderboard/gbfeedback.css" />
    <link rel="stylesheet" href="../../commoncss.css">
    <link rel="manifest" href="../../manifest.json" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta name="theme-color" content="#6200ee" />
</head>

<body data-theme="light">
    <div class="app">
        <div class="main">
            <aside class="controls">
                <h1>Sudoku Solver</h1>
                <div class="button-group">
                    <label>Size = </label>
                    <select id="sizeSelect"></select>
                    <!-- <button class="btn" id="newBtn">New Game</button> -->
                    <!-- <button class="btn" id="startBtn">Start / Fill</button> -->
                    <label id="lebelMaxSol" for="maxSolutions">Max Solutions = </label><input id="maxSolutions"
                        class="lebelMaxSolVal" type="number" value="1" min="1" max="100" />

                    <button class="button-primary" id="solveBtn">🔓 Solve</button>
                    <button class="btn" id="unsolveBtn">🔒Unsolve</button>
                    <button class="btn" id="resetBtn">🔄 Reset</button>
                    <button class="btn" id="undoBtn">↶ Undo</button>
                    <button class="btn" id="toggle-theme">🌙 Dark</button>
                    <button class="btn" id="toggle-sound">🔇 Music:Off</button>
                    <button class="button-primary" id="shareBtn">📤Sharing</button>

                    <button class="button-primary" onclick="openGlobalFeedback()">💬 Feedback</button>
                    <button class="button-primary"
                        onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
                    <p id="filledInfo">Filled: 0</p>
                    <p id="remainInfo">Empty: 0</p>
                    <p id="totalInfo">Total: 0</p>
                </div>
                <div id="numpad" class="numpad"></div>
                <div class="info">
                    <div class="small">Solutions</div>
                    <button class="btn" id="prevSol">First⏮️ ⏪Prev</button>
                    <div id="solIndex">0 / 0</div>
                    <button class="btn" id="nextSol">Next⏩ ⏭️last</button>
                </div>
                <div class="status" id="status">Ready — select size and click Start</div>

            </aside>

            <section class="board-wrap">
                <div id="boardContainer" class="board" aria-label="Sudoku board"></div>
            </section>
        </div>
    </div>
    <div id="gb-feedbackModal" class="gb-feedback-main-container"></div>
    <!-- Warning popup window -->
    <div class="warnbar" id="warnbar" aria-live="polite">
        <div class="row">
            <label id="warntext">Bigger the grid size and higher the no of solution may slow the solving process
            </label>
            <button id="warn" class="primary">Ok</button>
        </div>
    </div>
    <!-- Conformation popup window -->
    <div class="warnbar" id="conformbar">
        <div class="row">
            <p>Your filled data will be lost, are you sure?</p>
            <button id="confirmYes" class="primary">Yes</button>
            <button id="confirmNo" class="primary">No</button>
        </div>
    </div>
    <script type="module" src="../../leaderboard/gbfeedback.js"></script>
    <script type="module" src="js/script.js"></script>
    <!-- <script type="module">
        import { shareScore } from '../../leaderboard/share.js';
        document.getElementById("shareBtn").addEventListener("click", async () => {
            shareScore("5inARow", 0);
        });
    </script> -->
    <script>
        const themeToggle = document.getElementById('toggle-theme');
        function setTheme(t) {
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '☀️ Light'
            }
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '🌙 Dark'
            }
        }
        if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
        setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

        function openGlobalFeedback() {
            document.getElementById("gb-feedbackModal").style.display = 'flex';
        };

        function closeGlobalFeedback() {
            document.getElementById("gb-feedbackModal").style.display = 'none';
        };

        fetch('../../leaderboard/gbfeedback.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('gb-feedbackModal').innerHTML = htmlText;
                document.getElementById("gb-feedbackModal").style.display = 'none';
            });

        (async () => {
            const GAME_NAME = "Sudoku Solver";
            const GAME_SHORT = "SudokuSolver";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/sudoku_solver/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/sudoku_solver/index.html';

            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("../../sw.js")
                    .then(() => console.log("SW registered"))
                    .catch((err) => console.log("SW error", err));
            });
        }
    </script>
</body>

</html>
