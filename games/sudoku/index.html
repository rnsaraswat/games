<!doctype html>
<html lang="hi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sudoku</title>
  <meta name="description"
    content="Ravindra Games Hub — collection of lightweight web games (Sudoku) Solve login puzzles of numbers">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../leaderboard/gbfeedback.css" />
  <link rel="stylesheet" href="../../leaderboard/gbleaderboard.css" />
  <link rel="stylesheet" href="../../leaderboard/lcleaderboard.css" />
  <link rel="stylesheet" href="../../commoncss.css">
  <link rel="manifest" href="../../manifest.json" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta name="theme-color" content="#6200ee" />
</head>

<body>
  <div class="app">
    <div class="main">
      <aside class="controls">
        <h1>Sudoku</h1>
        <div class="button-group">
          <label>Board (N × N) =</label>
          <select id="sizeSel">
            <!-- standard ones -->
            <option value="4|2|2">4×4 [2×2]</option>
            <option value="6|2|3">6×6 [2x3]</option>
            <option value="8|2|4">8×8 [2x4]</option>
            <option value="9|3|3" selected>9×9 [3×3]</option>
            <option value="10|2|5">10×10 [2x5]</option>
            <option value="12|3|4">12×12 [3x4]</option>
            <option value="14|2|7">14×14 [2x7]</option>
            <option value="15|3|5">15×15 [3x5]</option>
            <option value="16|4|4">16×16 [4×4]</option>
            <option value="18|3|6">18×18 [3x6]</option>
            <option value="20|4|5">20×20 [4x5]</option>
            <option value="21|3|7">21×21 [3x7]</option>
            <option value="22|2|11">22×22 [2x11]</option>
            <option value="24|4|6">24×24 [4x6]</option>
            <option value="25|5|5">25×25 [5×5]</option>
          </select>
          <!-- <div style="display: inline-block;"> -->
          <label><input type="checkbox" id="notesToggle"> Notes ✎</label>
          <button id="newBtn" class="button-primary">🔄 New Game</button>
          <label>Difficulty = </label>
          <select id="diffSel">
            <option value="learner">📖 Learner</option>
            <option value="easy">😊 Easy</option>
            <option value="medium" selected>🤔 Medium</option>
            <option value="hard">🤯 Hard</option>
            <option value="expert">🧑‍🔬 Expert</option>
          </select>
          <button id="pauseBtn">⏸ Pause</button>
          <button id="resetBtn">🔄 Reset</button>
          <button id="undoBtn">↩️ Undo</button>
          <button id="redoBtn">↪️ Redo</button>
          <button id="hintBtn">💡 Hint</button>
          <button id="checkBtn">✔ Check</button>
          <button id="errorBtn">✅Error Off</button>
          <button id="solveBtn">🔓 Solve</button>
          <button id="toggle-theme">☀️ Light</button>
          <button id="toggle-sound">🔇 Music:Off</button>
          <button id="toggle-rules">📜View Rules</button>
          <button class="button-primary" id="toggle-gb-leaderboard" onclick="openGlobalLeaderboard()">🌍
            Global
            Leaderboard</button>
          <button class="button-primary" id="toggle-lc-leaderboard" onclick="openLocalLeaderboard()">🏆 Local
            Leaderboard</button>
          <button class="button-primary" id="shareBtn">📤Sharing</button>
          <button class="button-primary" onclick="openGlobalFeedback()">💬 Feedback</button>
          <button class="button-primary"
            onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
          <div id="info">
            <div id="mistakeInfo" class="info">Mistake: 0</div>
            <div id="filledInfo" class="info">Filled: 0</div>
            <div id="remainInfo" class="info">Empty: 0</div>
            <div id="timer-display">⏱ 00:00:00</div>
            <!-- <div>🏆 Best: <b id="best">—</b></div> -->
          </div>
          <div id="numpad" class="numpad"></div>
          <div id="statusText">Ready</div>
          <p id="loading">Loading...</p>
        </div>
        <!-- </div> -->

      </aside>
      <section class="board-wrap">
        <div id="gridContainer" class="grid"></div>
      </section>
    </div>
  </div>

  <div id="gb-feedbackModal" class="gb-feedback-main-container"></div>
  <div id="lcLeaderboardModal" class="lc-main-container"></div>
  <div id="gbLeaderboardModal" class="gb-main-container"></div>
  <div id="pauseModal" class="pause-container">
    <button id="closePaused">Game Paused</button>
  </div>

  <div id="winText">🎉 Completed 🎉</div>
  <canvas id="confettiCanvas"></canvas>

  <!-- Rules Popup -->
  <div id="rulesPopup" class="rules-popup-window">
    <div class="rules-header-section">
      <span id="rulesCloseBtn" class="rules-popup-close">Close X</span>
      <h2 class="rules-h2">Game Rules</h2>
    </div>
    <div class="rules-content">
      <p id="RulesBox"></p>
    </div>
  </div>


  <script type="module" src="../../leaderboard/gbfeedback.js"></script>
  <script type="module" src="../../leaderboard/gbleaderboard.js"></script>
  <script type="module" src="../../leaderboard/lcleaderboard.js"></script>
  <script type="module" src="js/script.js"></script>
  <script type="module" src="js/rules.js"></script>
  <script>
    document.getElementById("gb-feedbackModal").style.display = 'none';
    document.getElementById("lcLeaderboardModal").style.display = 'none';
    document.getElementById("gbLeaderboardModal").style.display = 'none';
    document.getElementById("winText").style.display = 'none';
    document.getElementById("rulesPopup").style.display = 'none';
    document.getElementById("pauseModal").style.display = 'none';


    const themeToggle = document.getElementById('toggle-theme');
    function setTheme(t) {
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '☀️ Light'
      }
      if (t === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '🌙 Dark'
      }
    }
    if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
    setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

    function openGlobalLeaderboard() {
      document.getElementById("gbLeaderboardModal").style.display = 'flex';
    };

    function closeGlobalLeaderboard() {
      document.getElementById("gbLeaderboardModal").style.display = 'none';
    };


    fetch('../../leaderboard/gbleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('gbLeaderboardModal').innerHTML = htmlText;
        document.getElementById("gbLeaderboardModal").style.display = 'none';
      });

    function openLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'flex';
    };

    function closeLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'none';
    };

    function clearLLB() {
      if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
        localStorage.removeItem('leaderboard');
        alert("All games Local Leaderboard Data is Cleared");
        textToSpeechEng('Local Leaderboard data cleared');
      }
    };

    fetch('../../leaderboard/lcleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
        document.getElementById("lcLeaderboardModal").style.display = 'none';
      });

    function openGlobalFeedback() {
      document.getElementById("gb-feedbackModal").style.display = 'flex';
    };

    function closeGlobalFeedback() {
      document.getElementById("gb-feedbackModal").style.display = 'none';
    };

    fetch('../../leaderboard/gbfeedback.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('gb-feedbackModal').innerHTML = htmlText;
        document.getElementById("gb-feedbackModal").style.display = 'none';
      });

    (async () => {
      const GAME_NAME = "Sudoku Game";
      const GAME_SHORT = "sudoku";

      const res = await fetch("../../manifest.json");
      const manifest = await res.json();

      manifest.short_name = GAME_SHORT;
      manifest.name = GAME_NAME;

      manifest.start_url = 'https://rnsaraswat.github.io/games/games/sudoku/index.html';
      manifest.scope = 'https://rnsaraswat.github.io/games/games/sudoku/index.html';

      // 🔥 icons ko absolute banane ka safety fix
      manifest.icons = manifest.icons.map(icon => ({
        ...icon,
        src: new URL(icon.src, location.origin).href
      }));

      const blob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("../../sw.js")
          .then(() => console.log("SW registered"))
          .catch((err) => console.log("SW error", err));
      });
    }
  </script>
</body>

</html>
