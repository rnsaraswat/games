<!doctype html>
<html lang="hi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sudoku</title>
    <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#6200ee" />
</head>

<body>
    <div class="app">
        <div class="main">
            <aside class="controls">
                <h1>Sudoku</h1>
                <div style="display: inline-block;">
                    <label>Board (N × N)
                        <select id="sizeSel">
                            <!-- standard ones -->
                            <option value="4|2|2">4×4 [2×2]</option>
                            <option value="6|2|3">6×6 [2x3]</option>
                            <option value="8|2|4">8×8 [2x4]</option>
                            <option value="9|3|3" selected>9×9 [3×3]</option>
                            <option value="10|2|5">10×10 [2x5]</option>
                            <option value="12|3|4">12×12 [3x4]</option>
                            <option value="14|2|7">14×14 [2x7]</option>
                            <option value="15|3|5">15×15 [3x5]</option>
                            <option value="16|4|4">16×16 [4×4]</option>
                            <option value="18|3|6">18×18 [3x6]</option>
                            <option value="20|4|5">20×20 [4x5]</option>
                            <option value="21|3|7">21×21 [3x7]</option>
                            <option value="22|2|11">22×22 [2x11]</option>
                            <option value="24|4|6">24×24 [4x6]</option>
                            <option value="25|5|5">25×25 [5×5]</option>
                        </select>
                    </label>
                    <label>Difficulty
                        <select id="diffSel">
                            <option value="learner">📖 Learner</option>
                            <option value="easy">😊 Easy</option>
                            <option value="medium" selected>🤔 Medium</option>
                            <option value="hard">🤯 Hard</option>
                            <option value="expert">🧑‍🔬 Expert</option>
                        </select>
                    </label>
                </div>
                <div style="display: inline-block;">
                    <label><input type="checkbox" id="notesToggle"> Notes ✎</label>

                    <button id="newBtn" class="primary">🔄 New Game</button>
                    <button id="pauseBtn" class="btn">⏸ Pause</button>
                    <button id="resetBtn" class="btn">🔄 Reset</button>
                    <button id="undoBtn" class="btn">↶ Undo</button>
                    <button id="redoBtn" class="btn">↷ Redo</button>
                    <button id="hintBtn" class="btn">💡 Hint</button>
                    <button id="checkBtn" class="btn">✔ Check</button>
                    <button id="errorBtn" class="btn">Error Off</button>
                    <button id="solveBtn" class="btn">🔓 Solve</button>
                    <button id="themeBtn" class="btn">☀️ Light</button>
                    <button class="primary" id="local-toggle-leaderboard">🏆 Local Leaderboard</button>
                    <button class="primary" id="toggle-leaderboard">🌍 Global Leaderboard</button>
                    <button class="primary" id="shareBtn">📤Sharing</button>

                    <button class="primary" id="toggle-feedback">📝Feedback</button>
                    <button class="primary"
                      onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
                    <button class="primary" id="toggle-rules">View Rules</button>
                    <button class="primary" id="toggle-sound">🔇 Music:Off"</button>
                    <div id="info">
                        <div id="timerInfo">⏱ 00:00</div>
                        <div id="mistakeInfo">❌ 0</div>
                        <div id="filledInfo">Filled: 0</div>
                        <div id="remainInfo">Empty: 0</div>
                        <!-- <div>🏆 Best: <b id="best">—</b></div> -->
                    </div>
                    <div id="numpad" class="numpad"></div>
                    <div id="statusText">Ready</div>
                    <p id="loading">Loading...</p>
                </div>
            </aside>
            <section class="board-wrap">
                <div id="gridContainer" class="grid"></div>
            </section>
        </div>
    </div>

    <div id="leaderboardPopup" class="popupWindow">
    </div>
    <div id="localleaderboardPopup" class="popupWindow">
    </div>
  <div id="feedbackPopup" class="popupWindow"></div>

    <div id="winText">🎉 Completed 🎉</div>
    <canvas id="confettiCanvas"></canvas>

    <!-- Rules Popup -->
    <div id="rulesPopup" class="popupWindow">
        <div class="popupHeadeer">
            <h3>Game Rules</h3>
            <button class="primary" id="hide-rules">Hide Rules</button>
        </div>
        <div class="popupContent">
            <ul id="RulesBox"></ul>
        </div>
    </div>

    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/rules.js"></script>
    <script type="module">
        import { renderLeaderboard, saveScore, sortTable } from '../../leaderboard/leaderboard.js';
        window.sortTable = sortTable;
        window.submitScore = async function (player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at) {
            try {
                await saveScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);
            } catch (e) {
                document.getElementById("msg").textContent = 'Error saving score in global leaderboard:' + e;
            }
        };
        document.addEventListener('DOMContentLoaded', () => {
            renderLeaderboard();
        });
    </script>

    <script type="module">
        import { localrenderLeaderboard } from '../../leaderboard/localleaderboard.js';
        document.addEventListener('DOMContentLoaded', () => {
            localrenderLeaderboard();
        });
    </script>

    <script>
        function hideFeedback() {
            document.getElementById("feedbackPopup").style.display = 'none';
        };

        function hideLB() {
            document.getElementById("leaderboardPopup").style.display = 'none';
        };

        function hideLLB() {
            document.getElementById("localleaderboardPopup").style.display = 'none';
        };

        function clearLLB() {
            if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
                localStorage.removeItem('leaderboard');
                alert("All games Local Leaderboard Data is Cleared");
                textToSpeechEng('Local Leaderboard data cleared');
            }
        };

        fetch('../../leaderboard/leaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('leaderboardPopup').innerHTML = htmlText;
            });

        fetch('../../leaderboard/localleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('localleaderboardPopup').innerHTML = htmlText;
            });

        fetch('../../leaderboard/feedback.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('feedbackPopup').innerHTML = htmlText;
            });

        document.getElementById("leaderboardPopup").style.display = 'none';
        document.getElementById("localleaderboardPopup").style.display = 'none';
        document.getElementById("feedbackPopup").style.display = 'none';

        document.getElementById("toggle-leaderboard").addEventListener("click", () => {
            if (document.getElementById("toggle-leaderboard").textContent == "Hide Global Leaderboard") {
                document.getElementById("toggle-leaderboard").textContent = "Global Leaderboard";
                document.getElementById("leaderboardPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("toggle-leaderboard").textContent = "Hide Global Leaderboard";
                document.getElementById("leaderboardPopup").style.display = 'block';
                loadCSS()
            }
        });

        document.getElementById("local-toggle-leaderboard").addEventListener("click", () => {
            if (document.getElementById("leaderboardPopup").style.display === 'block') {
                document.getElementById("local-toggle-leaderboard").textContent = "Local Leaderboard";
                document.getElementById("localleaderboardPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("toggle-leaderboard").textContent = "Hide Leaderboard";
                document.getElementById("localleaderboardPopup").style.display = 'block';
                loadCSS();
            }
        });

        document.getElementById("toggle-feedback").addEventListener("click", () => {
            if (document.getElementById("feedbackPopup").style.display === 'block') {
                document.getElementById("feedbackPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("feedbackPopup").style.display = 'block';
                loadfeedbakCSS();
            }
        });

        function loadfeedbakCSS() {
            var head = document.head;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = '../../leaderboard/feedback.css';
            head.appendChild(link);
        }

        function loadCSS() {
            var head = document.head;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = '../../leaderboard/leaderboard.css';
            head.appendChild(link);
        }
        window.onload = function () {
            loadCSS();
            loadfeedbakCSS();
        };

        (async () => {
            const GAME_NAME = "Sudoku Game";
            const GAME_SHORT = "sudoku";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/sudoku/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/sudoku/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./sw.js")
                    .then(() => console.log("SW registered"))
                    .catch((err) => console.log("SW error", err));
            });
        }
    </script>
</body>

</html>
