<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2430">
  <title>Ravindra Games Hub — Chess</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <header class="topbar">
      <a class="back-link" href="./" aria-label="Back to games">RGH</a>
      <h1>♟ Chess</h1>
      <button id="themeBtn" class="icon-btn" type="button" title="Change theme" aria-label="Change theme">◐
        Theme</button>
    </header>

    <section class="game-layout" aria-label="Chess game">
      <div class="game-main">
        <div class="controls">
          <label class="mode-label" for="modeSelect">Game mode</label>
          <select id="modeSelect">
            <option value="pvp">Player vs Player</option>
            <option value="computer">Player vs Computer</option>
          </select>
          <label id="levelLabel" for="levelSelect" hidden>AI level</label>
          <select id="levelSelect" hidden>
            <option>Easy</option>
            <option selected>Medium</option>
            <option>Hard</option>
          </select>
          <button id="newBtn" class="primary" type="button">↻ New Game</button>
          <button id="undoBtn" type="button">↶ Undo</button>
          <button id="deselectBtn" type="button">✕ Deselect</button>
          <button id="soundBtn" type="button" aria-pressed="true">♪ Sound On</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">White's turn</p>
        <div class="board-wrap">
          <div id="board" class="board" role="grid" aria-label="Chess board"></div>
        </div>
        <p class="hint">Select a piece to see its legal moves. Pawns promote to queens automatically.</p>
        <div class="moves-count">Moves played: <strong id="movesCount">0</strong></div>
      </div>

      <aside class="side-panel">
        <section class="panel">
          <h2>Captured Pieces</h2>
          <p><strong>White captured:</strong> <span id="capturedBlack">—</span></p>
          <p><strong>Black captured:</strong> <span id="capturedWhite">—</span></p>
        </section>
        <section class="panel history-panel">
          <h2>Move History</h2>
          <div id="history" class="history">No moves yet.</div>
        </section>
      </aside>
    </section>
    <footer>Ravindra Games Hub · Chess</footer>
  </main>
  <script src="js/chess.js"></script>
  <script src="js/chess-ui.js"></script>
</body>

</html>
