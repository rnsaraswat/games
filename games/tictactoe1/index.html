<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6200ee" />
    <title>Tic Tac Toe</title>
    <style>
        #container {
            display: flex;
            flex-direction: row;
            padding: 1px;
        }

        .section {
            box-sizing: border-box;
            padding: 10px;
            overflow: hidden;
        }

        #left {
            background: var(--bg);
            padding: 1px;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 40vw;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
            width: 100%;
        }

        .scoreboard {
            margin-top: 1px;
        }

        select:hover {
            background: var(--bg-hover);
        }

        input:hover {
            background: var(--bg-hover);
        }

        #message {
            width: 100%;
            text-align: center;
            background: var(--bg);
            margin-top: 1vh;
            margin-bottom: 1vh;
            padding: 10px;
            border: 3px dashed var(--box-shadow);
            color: var(--text-color);
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
        }

        #right {
            background: var(--bg);
            flex: 1;
            display: flex;
            align-items: center;
            padding: 1px;
            justify-content: center;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 2px;
            width: min(90vmin, 80%);
            height: min(90vmin, 80%);
        }

        .cell {
            /* user-select: none; */
            border: 2px solid var(--cell-border);
            background: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            font-weight: bold;
            cursor: pointer;
            aspect-ratio: 1/1;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
        }

        .cell:hover {
            background: var(--cell-bg-hover);
        }

        .cell.x {
            color: rgb(255, 0, 0);
        }

        .cell.o {
            color: rgb(0, 0, 255);
        }

        .cell.win {
            background: gold !important;
            color: black !important;
        }

        .cell.blink {
            animation: color 1s infinite;
        }

        @keyframes color {
            0% {
                font-size: 90px;
            }

            50% {
                font-size: 85px;
            }

            100% {
                font-size: 80px;
            }
        }

        #timer-display {
            font-family: 'Digital', Arial, Helvetica, sans-serif;
            text-align: center;
            width: auto;
            height: auto;
            font-size: 15px;
            padding: 5px 5px;
            margin: 5px 2px 5px 2px;
            background: var(--bg);
            color: var(--text);
            border: none;
        }

        @media (max-aspect-ratio: 1/1) {
            #container {
                flex-direction: column;
            }

            #left {
                width: 100%;
                max-width: 100%;
                flex: 0 0 auto;
            }

            #right {
                flex: 1;
                width: 100%;
            }

            #message {
                font-size: 20px;
            }

            select,
            label,
            input,
            button {
                font-size: 15px;
                margin-top: 1px;
            }

            button.primary {
                font-size: 25px;
            }

            #timer-display {
                font-size: 25px;
            }

        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        #winText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: gold;
            text-shadow: 2px 2px 10px #fff;
            font-weight: bold;
            opacity: 0;
            z-index: 2;
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        .name-main-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;

            width: 60%;
            height: 30%;
            border: 2px solid #333;
            z-index: 10;

            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        .name-top-section {
            width: 100%;
            padding: 8px;
            border-radius: 2px;
            color: white;
            text-align: center;
        }

        .name-mid-section {
            flex: 1;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: stretch;
            justify-content: center;
            gap: 10px;
        }

        .name-footer-section {
            display: flex;
            justify-content: space-around;
        }

        .name-primary-button {
            padding: 10px 12px;
            margin: 0px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 5px 25px 0 var(--box-shadow);
            border-radius: 5px;
            background: linear-gradient(90deg, var(--accent), #7c3aed);
            color: #fff;
            border-color: transparent;
            background: linear-gradient(180deg, #10b981, #059669);
            border: none;
            box-shadow: 0 10px 40px var(--box-shadow);
        }

        .name-primary-button:hover {
            background: linear-gradient(180deg, #059669, #10b981);
        }

        #namebar.show {
            display: flex;
        }

        .primary-btn {
            border-radius: 20px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
            border-radius: 0.5vw;
            color: #fff;
            border-color: transparent;
            border: none;
            box-shadow: 0 1vw 4vw var(--box-shadow);
            cursor: pointer;
            background: linear-gradient(to right, #03b703, #6ae86a, #03b703);
            background-size: 200% auto;
            transition: 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .primary-btn:hover {
            background-position: right center;
            color: #002200;
            transform: translateY(-2px);
        }
    </style>
    <link rel="stylesheet" href="../../leaderboard/firebasefeedback.css" />
    <link rel="stylesheet" href="../../leaderboard/firebasegbleaderboard.css" />
    <link rel="stylesheet" href="../../leaderboard/lcleaderboard.css" />
    <link rel="stylesheet" href="../../commoncss.css">
    <link rel="stylesheet" href="./shareDevice.css" />
    <link rel="manifest" href="../../manifest.json" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta name="theme-color" content="#6200ee" />
</head>

<body>
    <div id="container">
        <div id="left" class="section">
            <h1>TIC TAC TOE</h1>
            <div class="button-group">
                <button id="startGame">🔄 New Game</button>
                <button id="undo-last">↩️ Undo</button>
                <select id="mode">
                    <option value="pvp">😊Player vs 😊Player</option>
                    <option value="pvc" selected>😊Player vs 🤖Computer</option>
                </select>
                <select id="difficulty">
                    <option value="easy">😀 Easy</option>
                    <option value="medium">😐 Medium</option>
                    <option value="hard" selected>😩 Hard</option>
                </select>
                <button id="toggle-theme">☀️ Light</button>
                <button id="toggle-sound">🔇 Music:Off"</button>
                <button class="button-primary-memory" id="toggle-gb-leaderboard" onclick="openGlobalLeaderboard()">🌍
                    Global Leaderboard</button>
                <button class="button-primary-memory" id="toggle-lc-leaderboard" onclick="openLocalLeaderboard()">🏆
                    Local Leaderboard</button>
                <button class="primary-btn " id="shareBtn">📤Sharing</button>
                <button class="primary-btn " id="nativeShare">📤Sharing Mobile Native Share</button>
                <button id="shareDetectDevice">Share detect device</button>
                <button id="openFeedback" class="primary-btn" onclick="openGlobalFeedback()">💬 Feedback</button>
                <button class="primary-btn "
                    onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
            </div>
            <div id="timer-display">⏱️ 00:00:00</div>
            <div id="message"><br>Click New Game to play</div>
            <p id="loading">Loading...</p>
        </div>
        <div id="right">
            <div id="board"></div>
        </div>
    </div>
    </div>
    <div id="fb-feedbackModal" class="fb-container"></div>
    <div id="lcLeaderboardModal" class="lc-main-container"></div>
    <div id="firebasegbLeaderboardModal" class="firebase-main-container"></div>
    <div id="winText">🎉 You Won! 🎉</div>
    <div class="name-main-container" id="namebar">
        <div class="name-top-section">Player Name : <span id="player1"></span></div>
        <div class="name-mid-section">
            <label class="name-mid-section" for="nameInput">Other Player Name :
                <input type="text" id="nameInput" placeholder="ABC" value="ABC">
            </label>
        </div>
        <div class="name-footer-section">

            <button id="name" class="name-primary-button">Ok</button>
        </div>
    </div>
    <div id="sharePopup" class="share-popup">
        <div class="share-box-container">
            <h3>Share Your Score</h3>

            <div class="share-icons-group">
                <a id="twLink" class="share-icons" target="_blank">twitter</a>
                <a id="waLink" class="share-icons" target="_blank">whatapp</a>
                <a id="fbLink" class="share-icons" target="_blank">Facebook</a>
                <a id="tgLink" class="share-icons" target="_blank">Telegram</a>
                <a id="igLink" class="share-icons" target="_blank">Instagram</a>
                <button id="copyBtn" class="share-icons">Copy link</button>
            </div>

            <button id="closePopup">Close</button>
        </div>
    </div>
    <!-- <button onclick="report(${f.id})">🚩 Report</button> -->
    <script type="module" src="../../leaderboard/firebasefeedback.js"></script>
    <script type="module" src="../../leaderboard/firebasegbleaderboard.js"></script>
    <script type="module" src="../../leaderboard/lcleaderboard.js"></script>
    <canvas id="fireworksCanvas"></canvas>
    <script type="module" src="tictactoe1.js"></script>
    <script type="module" src="js/shareDevice.js"></script>
    <script type="module">
        import { shareScore } from './share.js';
        document.getElementById("shareBtn").addEventListener("click", async () => {
            shareScore("tictactoe", 0);
        });
    </script>
    <script>

        document.getElementById("fb-feedbackModal").style.display = 'none';
        document.getElementById("lcLeaderboardModal").style.display = 'none';
        document.getElementById("firebasegbLeaderboardModal").style.display = 'none';
        document.getElementById("winText").style.display = 'none';
        // document.getElementById("rulesPopup").style.display = 'none';

        const themeToggle = document.getElementById('toggle-theme');
        function setTheme(t) {
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '☀️ Light'
            }
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '🌙 Dark'
            }
        }
        if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
        setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

        function openGlobalLeaderboard() {
            document.getElementById("firebasegbLeaderboardModal").style.display = 'flex';
        };

        function closeFirebaseGlobalLeaderboard() {
            document.getElementById("firebasegbLeaderboardModal").style.display = 'none';
        };


        fetch('../../leaderboard/firebasegbleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('firebasegbLeaderboardModal').innerHTML = htmlText;
                document.getElementById("firebasegbLeaderboardModal").style.display = 'none';
            });

        function openLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'flex';
        };

        function closeLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'none';
        };

        function clearLLB() {
            if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
                localStorage.removeItem('leaderboard');
                alert("All games Local Leaderboard Data is Cleared");
                textToSpeechEng('Local Leaderboard data cleared');
            }
        };

        fetch('../../leaderboard/lcleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
                document.getElementById("lcLeaderboardModal").style.display = 'none';
            });

        function openGlobalFeedback() {
            document.getElementById("fb-feedbackModal").style.display = 'flex';
        };

        function closeFBFeedback() {
            document.getElementById("fb-feedbackModal").style.display = 'none';
        };

        fetch('../../leaderboard/firebasefeedback.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('fb-feedbackModal').innerHTML = htmlText;
                document.getElementById("fb-feedbackModal").style.display = 'none';
            });

        (async () => {
            const GAME_NAME = "TIC TAC TOE";
            const GAME_SHORT = "tictactoe";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/tictactoe1/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/tictactoe1/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();

    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("../../sw.js")
                    .then(() => console.log("SW registered"))
                    .catch((err) => console.log("SW error", err));
            });
        }
    </script>
</body>

</html>
