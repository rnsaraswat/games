<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6200ee" />
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg: #f0f0f0;
            --text-color: #111;
            --cell-bg: #fff;
            --cell-bg-hover: #c1c1c1;
            --cell-border: #333;
            --box-shadow: rgba(0, 0, 0, 0.2);
            --bg-hover: #d1d1d1;
            --bg-gradient1: #b7b103;
            --bg-gradient2: #e8db6a;

        }

        [data-theme='dark'] {
            --bg: #121212;
            --text-color: #eee;
            --cell-bg: #1e1e1e;
            --cell-bg-hover: #5f5f5f;
            --cell-border: #d9d8d8;
            --box-shadow: rgba(255, 255, 255, 0.5);
            --bg-hover: #454545;
            --bg-gradient1: #0c03b7;
            --bg-gradient2: #6e6ae8;
        }

        @font-face {
            font-family: 'EnglishFontBangers';
            src: url('../../assets/font/Bangers-Regular.ttf') format('truetype');
        }

        @font-face {
            font-family: 'Digital';
            src: url('../../assets/font/digital-italic.ttf') format('truetype');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
            flex-wrap: wrap;
            justify-content: center;

            /* display: flex;
            align-items: center;
            overflow: hidden; बाहर का स्क्रॉल बंद */
        }

        #container {
            display: flex;
            flex-direction: row;
            padding: 0.1vw;
        }

        .section {
            box-sizing: border-box;
            padding: 1vw;
            overflow: hidden;
        }

        #left {
            background: var(--bg);
            padding: 0.1vw;
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 40vw;
        }

        #left h1 {
            text-align: center;
            font-size: 4vw;
            font-family: 'EnglishFontBangers', Arial, Helvetica, sans-serif;
            color: var(--text-color);
            letter-spacing: .8vw;
            text-shadow: 0 1px 0 #030303,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px var(--box-shadow),
                0 0 5px var(--box-shadow),
                0 1px 3px var(--box-shadow),
                0 3px 5px var(--box-shadow),
                0 5px 10px var(--box-shadow),
                0 10px 10px var(--box-shadow),
                0 20px 20px var(--box-shadow);
            margin-bottom: 1vw;
        }

        h3 {
            text-align: center;
            margin: 0;
            margin: 0.4vw;
            padding: 0.5vw;
            background: var(--bg);
            color: var(--text-color);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1vw;
            justify-content: center;
            margin-bottom: 1vw;
            width: 100%;
        }

        select,
        label,
        input,
        button {
            padding: 1vw 1.2vw;
            font-size: 1.6vw;
            margin-top: 0.1vh;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
            cursor: pointer;
            background: var(--bg);
            color: var(--text-color);
            border: 0.2vw solid var(--cell-border);
            border-radius: 0.5vw;
        }

        .scoreboard {
            margin-top: 1vh;
        }

        select:hover {
            background: var(--bg-hover);
        }

        input:hover {
            background: var(--bg-hover);
        }

        /* button:hover {
            background: var(--bg-hover);
        } */

        p {
            display: inline;
            padding: 1vw 1.2vw;
            font-size: 1.6vw;
            margin-top: 1vh;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
            cursor: pointer;
            background: var(--bg);
            color: var(--text-color);
            border: 0.2vw solid var(--cell-border);
        }

        /* button.primary {
            gap: 0.8vw;
            align-items: center;
            flex-wrap: wrap;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            padding: 1vw 1.2vw;
            margin: 1vw 0.2vw 0.5vw 0.2vw;
            font-size: 1.6vw;
            display: inline-block;
            margin-top: 0.1vh;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
            border-radius: 0.5vw;
            background: linear-gradient(90deg, #9762f1, #7c3aed);
            color: #fff;
            border-color: transparent;
            background: linear-gradient(180deg, #10b981, #059669);
            border: none;
            box-shadow: 0 1vw 4vw var(--box-shadow);
        }

        button.primary:hover {
            opacity: 0.6;
        } */

        table,
        th,
        td {
            border: 1px solid var(--cell-border);
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
        }

        #message {
            width: 100%;
            text-align: center;
            background: var(--bg);
            margin-top: 1vh;
            margin-bottom: 1vh;
            padding: 1vw;
            border: 0.3vw dashed var(--box-shadow);
            color: var(--text-color);
            font-weight: bold;
            font-size: 1.5vw;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
        }

        #right {
            background: var(--bg);
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0.1vw;
            justify-content: center;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 0.2vw;
            width: min(90vmin, 80%);
            height: min(90vmin, 80%);
        }

        .cell {
            /* user-select: none; */
            border: 0.2vw solid var(--cell-border);
            background: var(--cell-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8vw;
            font-weight: bold;
            cursor: pointer;
            aspect-ratio: 1/1;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
        }

        .cell:hover {
            background: var(--cell-bg-hover);
        }

        .cell.x {
            color: rgb(255, 0, 0);
        }

        .cell.o {
            color: rgb(0, 0, 255);
        }

        .cell.win {
            background: gold !important;
            color: black !important;
        }

        .cell.blink {
            animation: color 1s infinite;
        }

        @keyframes color {
            0% {
                font-size: 8.2vw;
            }

            50% {
                font-size: 8.1vw;
            }

            100% {
                font-size: 8vw;
            }
        }

        #timerdisplay {
            font-family: 'Digital', Arial, Helvetica, sans-serif;
            font-size: 1.8vw;
            font-weight: bold;
            color: var(--text-color);
        }


        .feedback-btn-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text-color);
            /* background: #f4f4f4; */
            padding: 10px;
            border-radius: 8px;
            /* width: fit-content; */
            border-bottom: 1px solid var(--cell-border);
            /* border-bottom: 1px solid #ddd; */
            justify-content: center;
            flex-wrap: wrap;
        }

        .feedback-btn {
            cursor: pointer;
            padding: 5px 10px;
            /* border: 1px solid #ccc; */
            border-bottom: 1px solid var(--cell-border);

            background: var(--bg);
            color: var(--text-color);
            /* background: white; */
            border-radius: 4px;
            transition: 0.3s;
        }

        #submitFeedback {
            background: linear-gradient(to right, var(--bg-gradient1), var(--bg-gradient2), var(--bg-gradient1));
            background-size: 100% auto;
            transition: 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

        }

        #submitFeedback:hover {
            background-position: right center;
            color: #002200;
            transform: translateY(-2px);
        }

        /* टॉगल होने पर सक्रिय रंग */
        .active-like {
            background-color: #4CAF50;
            color: white;
            border-color: #388E3C;
        }

        .active-dislike {
            background-color: #f44336;
            color: white;
            border-color: #d32f2f;
        }

        #ratingSelect {
            padding: 5px;
            border-radius: 4px;
        }

        /* 🧭 Portrait (Top-Bottom layout) */
        @media (max-aspect-ratio: 1/1) {
            #container {
                flex-direction: column;
            }

            #left {
                width: 100%;
                max-width: 100%;
                flex: 0 0 auto;
            }

            #right {
                flex: 1;
                width: 100%;
            }

            #message {
                font-size: 3vw;
            }

            select,
            label,
            input,
            button {
                padding: 1vw 2vw;
                margin: 1vw 0.5vw 0.1vw 0.5vw;
                font-size: 3vw;
                margin-top: 0.1vh;
            }

            button.primary {
                padding: 1vw 2vw;
                margin: 1vw 0.5vw 0.1vw 0.5vw;
                font-size: 3vw;
            }

            #timerdisplay {
                font-size: 3vw;
            }

        }

        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .namebar {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40%;
            height: 27%;
            bottom: 1vw;
            background: var(--bg);
            color: var(--text);
            border: 0.1vw solid var(--cell-border);
            border-radius: 1.4vw;
            padding: 1vw;
            z-index: 10001;
            display: none;
            gap: 1vw;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 1vw 4vw rgba(0, 0, 0, .45);
        }

        .namebar.show {
            display: flex;
        }

        .namebar .row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8vw;
            background: var(--bg);
            padding: 0.6vh 0.8vw;
            border-radius: 1vw;
        }

        .namebar label {
            color: var(--text);
            font-size: 1.2vw;
        }

        .namebar input[type="text"] {
            border: 0.1vw solid var(--cell-border);
            background: var(--bg);
            color: var(--text);
            border-radius: 0.8vw;
            padding: 0.4vh 0.6vw;
        }

        /* <!-- Feedback Modal --> */
        .primary-btn {
            /* position: fixed; */
            /* bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            border: none; */
            /* background: #4f46e5;
            color: white; */
            border-radius: 20px;

            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 0.5vw 2.5vw 0 var(--box-shadow);
            border-radius: 0.5vw;
            /* background: linear-gradient(90deg, #9762f1, #7c3aed); */
            color: #fff;
            border-color: transparent;
            /* background: linear-gradient(180deg, #10b981, #059669); */
            border: none;
            box-shadow: 0 1vw 4vw var(--box-shadow);
            cursor: pointer;

            background: linear-gradient(to right, #03b703, #6ae86a, #03b703);
            background-size: 200% auto;
            transition: 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .primary-btn:hover {
            background-position: right center;
            color: #002200;
            transform: translateY(-2px);
        }


        .modal {
            display: none;
            /* position: fixed; */
            inset: 0;
            background: rgba(0, 0, 0, 0.6);

            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 2vw;
            border-radius: 1vw;
            display: none;
            z-index: 10;
            width: 95%;
            height: 95%;
            overflow-y: auto;
            text-align: center;
            border: 0.2vw solid var(--cell-border);
            background: var(--bg);
            color: var(--text-color);
            font-size: 2vw;

            width: 90vw;
            height: 90vh;
            /* background: white; */
            /* border: 2px solid #333; */
            display: flex;
            flex-direction: column;
            /* सामान को ऊपर से नीचे सेट करने के लिए */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            /* ताकि फुटर बाहर न निकले */
        }


        .modal-content {
            background: var(--bg);
            color: var(--text-color);
            /* width: 100%;
            height: 100%; */
            /* max-width: 40vw; */
            /* margin: 10% auto; */
            /* padding: 1vw;
            border-radius: 2vw; */

            /* #leaderboardPopup { */

            /* } */
            padding: 15px;
            /* background: #2c3e50; */
            /* color: black; */
            text-align: center;
        }

        #userName {
            float: left;
        }

        .popupClose {
            float: right;
            cursor: pointer;
            font-size: 2vw;
            color: white;
            background-color: #e74c3c;
            background: linear-gradient(to right, #b50101, #ee9090, #b50101);
            background-size: 200% auto;
            transition: 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 0.5vw 1vw;
            border-radius: 1vw;
        }

        .popupClose:hover {
            background-position: right center;
            color: #002200;
            transform: translateY(-2px);
        }

        small {
            padding: 0vw 2vw;
        }

        textarea,
        input {
            width: 100%;
            margin: 0.5vw 0;
            padding: 0.8vw;
        }


        .feedback-list {
            /* flex: 1; */
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }


        .feedback-item {
            background: #f3f4f6;
            padding: 0.8vw;
            margin-bottom: 0.5vw;
            border-radius: 0.5vw;
        }

        .feedback-footer-section {
            padding: 15px;
            background: #f1f1f1;
            border-top: 1px solid var(--cell-border);
            display: flex;
            justify-content: space-around;
        }
    </style>

                    <button id="submitFeedback" class="feedback-btn">Submit</button>

                </div>
                <hr />
                <div id="feedbackList" class="feedback-list"></div>

        </div>

        function formatCustomDateIntl(date) {
            const options = {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZoneName: 'short',
                hour12: false
            };

            const formatted = new Intl.DateTimeFormat('en-GB', options).format(date);
            const parts = formatted.split(', ');
            const [dayMonthYear, time] = parts;

            const [day, monthNum, year] = dayMonthYear.split('/');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const monthName = months[parseInt(monthNum, 10) - 1];

            return `${day} ${monthName} ${year} ${time} ${parts[2]}`;
        }

        function formatCustomDate(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const day = date.getDate().toString().padStart(2, '0');
            const month = months[date.getMonth()];
            const year = date.getFullYear();
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');

            const timeZoneString = date.toString().match(/\(([A-Z]+)\)/)?.[1] || date.toString().split(' ').slice(-1)[0];

            const offset = date.getTimezoneOffset();
            const offsetAbs = Math.abs(offset);
            const offsetSign = offset > 0 ? '-' : '+';
            const offsetHours = Math.floor(offsetAbs / 60).toString().padStart(2, '0');
            const offsetMinutes = (offsetAbs % 60).toString().padStart(2, '0');
            const numericTimeZone = `GMT${offsetSign}${offsetHours}${offsetMinutes}`;

            const finalTimeZone = timeZoneString && timeZoneString.length <= 4 ? timeZoneString : numericTimeZone;

            return `${day} ${month} ${year} ${hours}:${minutes}:${seconds} ${finalTimeZone}`;
        }
