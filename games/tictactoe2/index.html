  <script type="module">
    import { renderLeaderboard, saveScore, sortTable } from '../../leaderboard/leaderboard.js';

    window.sortTable = sortTable;
    window.submitScore = async function (player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at) {
      try {
        await saveScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);
      } catch (e) {
        document.getElementById("msg").textContent = 'Error saving score in global leaderboard:' + e;
      }
    };
    document.addEventListener('DOMContentLoaded', () => {
      renderLeaderboard();
    });
  </script>

  <script>
    document.getElementById("gb-feedbackModal").style.display = 'none';
    document.getElementById("lcLeaderboardModal").style.display = 'none';
    document.getElementById("gbLeaderboardModal").style.display = 'none';

    function hideFeedback() {

    function hideLB() {
      document.getElementById("leaderboardPopup").style.display = 'none';
    };

    function hideLLB() {
      document.getElementById("localleaderboardPopup").style.display = 'none';
    };

    function clearLLB() {
      if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
        localStorage.removeItem('leaderboard');
        alert("All games Local Leaderboard Data is Cleared");
        textToSpeechEng('Local Leaderboard data cleared');
      }
    };

    fetch('../../leaderboard/leaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('leaderboardPopup').innerHTML = htmlText;
      });

    fetch('../../leaderboard/localleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('localleaderboardPopup').innerHTML = htmlText;
      });

    fetch('../../leaderboard/feedback.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('feedbackPopup').innerHTML = htmlText;
      });

    document.getElementById("leaderboardPopup").style.display = 'none';
    document.getElementById("localleaderboardPopup").style.display = 'none';
    document.getElementById("feedbackPopup").style.display = 'none';

    document.getElementById("toggle-leaderboard").addEventListener("click", () => {
      if (document.getElementById("toggle-leaderboard").style.display === 'block') {
        document.getElementById("leaderboardPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("leaderboardPopup").style.display = 'block';
        loadCSS()
      }
    });

    document.getElementById("local-toggle-leaderboard").addEventListener("click", () => {
      if (document.getElementById("leaderboardPopup").style.display === 'block') {
        document.getElementById("localleaderboardPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("localleaderboardPopup").style.display = 'block';
        loadCSS();
      }
    });

    document.getElementById("toggle-feedback").addEventListener("click", () => {
      if (document.getElementById("feedbackPopup").style.display === 'block') {
        document.getElementById("feedbackPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("feedbackPopup").style.display = 'block';
        loadfeedbakCSS();
      }
    });

    function loadfeedbakCSS() {
      var head = document.head;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = '../../leaderboard/feedback.css';
      head.appendChild(link);
    }

    function loadCSS() {
      var head = document.head;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = '../../leaderboard/leaderboard.css'; // 
      head.appendChild(link);
    }


    window.onload = function () {
      loadCSS();
      loadfeedbakCSS();
    };

    (async () => {
      const GAME_NAME = "TIC TAC TOE";
      const GAME_SHORT = "tictactoe";

      const res = await fetch("../../manifest.json");
      const manifest = await res.json();

      manifest.short_name = GAME_SHORT;
      manifest.name = GAME_NAME;

      manifest.start_url = 'https://rnsaraswat.github.io/games/games/tictactoe2/index.html';
      manifest.scope = 'https://rnsaraswat.github.io/games/games/tictactoe2/index.html';

      // 🔥 icons ko absolute banane ka safety fix
      manifest.icons = manifest.icons.map(icon => ({
        ...icon,
        src: new URL(icon.src, location.origin).href
      }));

      const blob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);
    })();

  </script>
  <script type="module">
    // import { shareScore } from '../../leaderboard/share.js';
    import { localrenderLeaderboard, saveToLeaderboard } from '../../leaderboard/localleaderboard.js';
    let gameName = 'tictactoe';
    let score = 0;
    // ---------------- Game Logic ----------------
    const board = document.getElementById("board");
    const cells = document.querySelectorAll(".cell");
    let currentPlayer = "X";
    let gameActive = true;
    let moves = 0;

    const winningCombos = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6],
    ];

    cells.forEach((cell) => {
      cell.addEventListener("click", () => {
        if (!gameActive || cell.textContent) return;
        cell.textContent = currentPlayer;
        if (checkWinner()) {
          updateleaderboard();
          alert(`${currentPlayer} wins!`);
          score = 9 * 10 - moves * 2 + 50;
          shareScore(gameName, score);
          gameActive = false;
          // window.submitScore("tictactoe", 100);
        } else if ([...cells].every((c) => c.textContent)) {
          alert("Draw!");
          gameActive = false;
          // window.submitScore("tictactoe", 50);
        } else {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
        }
      });
    });

    function checkWinner() {
      return winningCombos.some((combo) => {
        return combo.every((index) => cells[index].textContent === currentPlayer);
      });
    }

    function updateleaderboard() {
      winnerName = currentPlayer === 'x' ? player1 : player2;
      // let score = 0;
      let opponent = player2;
      let game_id = 'tictactoe';
      let gsize = "3x3";
      let elapsed = hours * 3600 + minutes * 60 + seconds;
      gameCount = history.length;
      moves = cells.forEach((cell) => {
        if (cell.textContent) moves++;
      });
      let difficulty = 'easy';
      let filed1 = 0;
      let filed2 = 0
      let filed3 = "-";
      let filed4 = "-";
      let email = localStorage.getItem('email') || '-';
      const created_at = new Date();
      if (currentPlayer === 'o') {
        winnerName = 'Computer';
        opponent = player1;
        score = (size * size - history.length) * 10 + 100;
      } else {
        winnerName = player1;
        opponent = 'Computer';
        score = (size * size - history.length) * 10 + 50;
      }

      saveToLeaderboard(winnerName, opponent, email, gsize, difficulty, game_id, score, elapsed, gameCount, filed1, filed2, filed3, filed4, created_at)
      // const entry = { winnerName, opponent, email, gsize, difficulty, game_id, score, elapsed, gameCount, filed1, filed2, filed3, filed4, created_at };
      // const boardData = JSON.parse(localStorage.getItem("leaderboard") || "[]");
      // boardData.push(entry);
      // localStorage.setItem("leaderboard", JSON.stringify(boardData));

      window.submitScore &&
        window.submitScore(winnerName, opponent, email, gsize, difficulty, game_id, score, elapsed, gameCount, filed1, filed2, filed3, filed4, created_at);
    }

  <script>
    window.shareScoreCommon = async function (gameName, score = 0) {

      const siteName = "Ravindra Games Hub";
      let gameLink = `https://rnsaraswat.github.io/games/index.html`;
      let textToShare;
      if (gameName == '-') {
        gameLink = `https://rnsaraswat.github.io/games/index.html`;

        textToShare =
          `${siteName}
      Play here:
  ${gameLink}`;
      } else {
        gameLink = `https://rnsaraswat.github.io/games/games/${gameName}/index.html`;

        textToShare =
          `${siteName}
  ${gameName}
  Can you beat my Score: ${score}
  
  Play here:
  ${gameLink}`;
        console.log("gamelink", gameLink);
      }

      const imageUrl = "../../assets/icons/maskable-icon.png";

      try {
        await navigator.share({
          title: siteName,
          text: textToShare
        });
        console.log("try", gameLink);

        const blob = await (await fetch(imageUrl)).blob();
        const file = new File([blob], "../../assets/icons/maskable-icon.png", { type: "image/png" });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file]
          });
          console.log("navigator.canShare && navigator.canShare", file, blob);
        }

      } catch (err) {
        console.log("Share cancelled or failed", err);
      }
    }
  </script>
