<!doctype html>
<html lang="hi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Magic Jigsaw</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="left" class="section">
            <h1>Magic Jigsaw</h1>
            <!-- <div class="status" id="status">Pieces: 0 | Placed: 0 | Time: 00:00:00</div> -->
            <div class="infoLabel">Pieces:
                <span id="pieces" class="infoName">0</span>
            </div>
            <div class="infoLabel">Placed:
                <span id="placeed" class="infoName">0</span>
            </div>
            <div id="timer-display" class="info">⏱️ 00:00:00</div>
            <button id="startBtn">Start</button>
            <button id="resetBtn" class="smallbtn">Reset</button>
            <button id="hintBtn" class="smallbtn">Show Hint</button>
            <button id="toggle-theme">☀️ Light</button>
            <button id="toggle-sound">🔇 Music:Off</button>
            <button class="primary" id="local-toggle-leaderboard">🏆 Local Leaderboard</button>
            <button class="primary" id="toggle-leaderboard">🌍 Global Leaderboard</button>
            <button class="smallbtn" onclick="setting()">⚙️ Setting</button>
        </div>
        <div id="right">
            <div id="board" class="board">
                <div id="hintOverlay" class="hint-overlay" style="display:none"></div>
            </div>
        </div>
    </div>
    <div id="settingPopup" class="popupWindow">
        <button class="smallbtn" onclick="setting()">❌ Close</button>

        <label>Choose image (built-in / upload / URL)</label>
        <div class="gallery" id="gallery"></div>

        <div style="display:flex;gap:8px;margin-top:8px">
            <input id="fileInput" type="file" accept="image/*" />
            <input id="urlInput" type="text" placeholder="Paste image URL and press Load" />
            <button id="loadUrlBtn" class="smallbtn">Load</button>
        </div>

        <label>Difficulty</label>
        <select id="difficulty">
            <option value="easy">😊 Easy — 3 × 4</option>
            <option value="medium" selected>🤔 Medium — 4 × 6</option>
            <option value="hard">🤯 Hard — 6 × 8</option>
            <option value="extreme">Extreme — 10 × 14</option>
        </select>

        <label>Options</label>
        <div style="display:flex;gap:8px">
            <select id="snapMode">
                <option value="smart">Snap: Smart (threshold)</option>
                <option value="grid">Snap: Grid (exact)</option>
                <option value="none">Snap: Off</option>
            </select>
            <select id="rotationMode">
                <option value="none" selected>Rotate: Off</option>
                <option value="double">Rotate: Double-click</option>
            </select>
        </div>

        <div class="controls">
            <button id="startBtn">Start / Shuffle</button>
            <button id="resetBtn" class="smallbtn">Reset</button>
        </div>

        <div class="controls" style="margin-top:8px">
            <button id="hintBtn" class="smallbtn">Show Hint</button>
            <button id="downloadBtn" class="smallbtn">Download Result</button>
        </div>

        <button id="toggle-theme">☀️ Light</button>
        <button id="toggle-sound">🔇 Music:Off</button>
        <button class="primary" id="local-toggle-leaderboard">🏆 Local Leaderboard</button>
        <button class="primary" id="toggle-leaderboard">🌍 Global Leaderboard</button>
    </div>

    <div id="leaderboardPopup" class="popupWindow">
    </div>
    <div id="localleaderboardPopup" class="popupWindow">
    </div>
    <div id="winText">🎉 You Won! 🎉</div>
    <script type="module" src="js/script.js"></script>
    <script type="module">
        import { renderLeaderboard, saveScore, sortTable } from '../../leaderboard/leaderboard.js';
        window.sortTable = sortTable;
        window.submitScore = async function (player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at) {
            try {
                await saveScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);
            } catch (e) {
                document.getElementById("msg").textContent = 'Error saving score in global leaderboard:' + e;
            }
        };
        document.addEventListener('DOMContentLoaded', () => {
            renderLeaderboard();
        });
    </script>

    <script type="module">
        import { localrenderLeaderboard } from '../../leaderboard/localleaderboard.js';
        document.addEventListener('DOMContentLoaded', () => {
            localrenderLeaderboard();
        });
    </script>

    <script>
        function setting() {
            if (document.getElementById("settingPopup").style.display === 'block') {
                document.getElementById("settingPopup").style.display = 'none';
            } else {
                document.getElementById("settingPopup").style.display = 'block';
            }
        }

        fetch('../../leaderboard/leaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('leaderboardPopup').innerHTML = htmlText;
            });

        fetch('../../leaderboard/localleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('localleaderboardPopup').innerHTML = htmlText;
            });
        document.getElementById("leaderboardPopup").style.display = 'none';
        document.getElementById("localleaderboardPopup").style.display = 'none';
        document.getElementById("settingPopup").style.display = 'none';

        document.getElementById("toggle-leaderboard").addEventListener("click", () => {
            if (document.getElementById("toggle-leaderboard").style.display === 'block') {
                // document.getElementById("toggle-leaderboard").textContent = "Global Leaderboard";
                document.getElementById("leaderboardPopup").style.display = 'none';
                return;
            } else {
                // document.getElementById("toggle-leaderboard").textContent = "Hide Global Leaderboard";
                document.getElementById("leaderboardPopup").style.display = 'block';
                loadCSS()
            }
        });

        document.getElementById("local-toggle-leaderboard").addEventListener("click", () => {
            if (document.getElementById("leaderboardPopup").style.display === 'block') {
                // document.getElementById("local-toggle-leaderboard").textContent = "Local Leaderboard";
                document.getElementById("localleaderboardPopup").style.display = 'none';
                return;
            } else {
                // document.getElementById("toggle-leaderboard").textContent = "Hide Leaderboard";
                document.getElementById("localleaderboardPopup").style.display = 'block';
                loadCSS();
            }
        });

        function loadCSS() {
            var head = document.head;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = '../../leaderboard/leaderboard.css';
            head.appendChild(link);
        }
    </script>
</body>

</html>
