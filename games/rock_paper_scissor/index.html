<!doctype html>
<html lang="hi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rock Paper Scissors</title>
    <meta name="description" content="Ravindra Games Hub — collection of lightweight web games (Rock Paper Scissors)">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../leaderboard/firebasefeedback.css" />
    <link rel="stylesheet" href="../../leaderboard/firebasegbleaderboard.css" />
    <link rel="stylesheet" href="../../leaderboard/lcleaderboard.css" />
    <link rel="stylesheet" href="../../commoncss.css">
    <link rel="manifest" href="../../manifest.json" />
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta name="theme-color" content="#6200ee" />
</head>

<body>
    <div class="container">
        <div class="main">
            <div id="left" class="section">
                <h1>Rock Paper Scissors</h1>
                <div class="button-group">
                    <label class="label" for="match-length">Match Length</label>
                    <select id="match-length" aria-controls="score result">
                        <option value="3">Best of 3</option>
                        <option value="5" selected>Best of 5</option>
                        <option value="7">Best of 7</option>
                        <option value="9">Best of 9</option>
                    </select>
                    <label class="label" for="difficulty">Difficulty</label>
                    <select id="difficulty">
                        <option value="easy">😊 Easy</option>
                        <option value="medium">🤔 Medium</option>
                        <option value="hard" selected>🤯 Hard</option>
                    </select>
                    <button id="reset" class="primaryColor">🔄 New Game</button>
                    <button id="toggle-theme">☀️ Light</button>
                    <button class="primary" id="toggle-sound">🔇 Music:Off</button>
                    <button class="button-primary" id="toggle-gb-leaderboard" onclick="openFirebaseGlobalLeaderboard()">🌍
                        Global
                        Leaderboard</button>
                    <button class="button-primary" id="toggle-lc-leaderboard" onclick="openLocalLeaderboard()">🏆 Local
                        Leaderboard</button>
                    <button class="button-primary" id="shareBtn">📤Sharing</button>
                    <button class="button-primary" onclick="openGlobalFeedback()">💬 Feedback</button>
                    <button class="button-primary"
                        onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
                </div>
                <div class="result-box">
                    <div id="statusText">Best of 5 — who wins the first 3 will win</div>
                    <div id="result" class="result muted">Click Rock, Paper and Scissors button for your choice</div>
                    <div id="match-winner" style="margin-top:8px;font-weight:700"></div>
                </div>
                <p id="loading">Loading...</p>
            </div>

            <section class="right">
                <div>
                    <div class="arena" role="group" aria-label="Play area">
                        <div class="choice-box">
                            <div class="choice-label">Your Choice</div>
                            <div id="player-pick" class="choice-emoji">❓</div>
                            <div class="choice-label" id="player-pick-name">-</div>
                        </div>

                        <div class="vs">VS</div>

                        <div class="choice-box">
                            <div class="choice-label">Computer Choice</div>
                            <div id="computer-pick" class="choice-emoji">❔</div>
                            <div class="choice-label" id="computer-pick-name">-</div>
                        </div>
                    </div>

                    <div class="pick-row" role="toolbar" aria-label="Moves">
                        <button class="btn btn-primary pick" data-move="rock">🪨 Rock</button>
                        <button class="btn btn-primary pick" data-move="paper">📄 Paper</button>
                        <button class="btn btn-primary pick" data-move="scissors">✂️ Scissors</button>
                    </div>
                    <div class="controls-top">
                        <div class="scoreboard">
                            <div class="score">
                                <div class="playersmall">You
                                    <div>
                                        <div class="playersmall" id="player-score">0
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="score">
                                <div class="playersmall">Computer</ div>
                                    <div class="playersmall" id="computer-score">0
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div id="fb-feedbackModal" class="fb-container"></div>
    <div id="lcLeaderboardModal" class="lc-main-container"></div>
    <div id="firebaseLeaderboardModal" class="firebase-main-container"></div>
    <div class="confetti-container">
        <div id="winText">🎉 Completed 🎉</div>
    </div>
    <script type="module" src="../../leaderboard/firebasefeedback.js"></script>
    <script type="module" src="../../leaderboard/firebasegbleaderboard.js"></script>
    <script type="module" src="../../leaderboard/lcleaderboard.js"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="../../leaderboard/leaderboard-controller.js"></script>
    <!-- <script type="module">
        import { shareScore } from '../../leaderboard/share.js';
        document.getElementById("shareBtn").addEventListener("click", async () => {
            console.log("shareBtn clicked")
            shareScore("rockpaperscissor", 0);
        });
    </script> -->

    <script>
        document.getElementById("fb-feedbackModal").style.display = 'none';
        document.getElementById("lcLeaderboardModal").style.display = 'none';
        document.getElementById("firebaseLeaderboardModal").style.display = 'none';
        document.getElementById("winText").style.display = 'none';
        // document.getElementById("rulesPopup").style.display = 'none';

        const themeToggle = document.getElementById('toggle-theme');
        function setTheme(t) {
            if (t === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '☀️ Light'
            }
            if (t === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('rg_theme', t);
                themeToggle.textContent = '🌙 Dark'
            }
        }
        if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
        setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

        function openFirebaseGlobalLeaderboard() {
            document.getElementById("firebaseLeaderboardModal").style.display = 'flex';
        };

        function closeFirebaseGlobalLeaderboard() {
            document.getElementById("firebaseLeaderboardModal").style.display = 'none';
        };


        fetch('../../leaderboard/firebasegbleaderboard.html')
    .then(response => response.text())
            .then(htmlText => {
                document.getElementById('firebaseLeaderboardModal').innerHTML = htmlText;
                document.getElementById("firebaseLeaderboardModal").style.display = 'none';

                setTimeout(() => {
                    console.log("window.initLeaderboard =", window.initLeaderboard);
                    if (window.initLeaderboard) {
                        window.initLeaderboard();
                    } else {
                        console.error("initLeaderboard not found");
                    }
                }, 500);
            });

        function openLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'flex';
        };

        function closeLocalLeaderboard() {
            document.getElementById("lcLeaderboardModal").style.display = 'none';
        };

        function clearLLB() {
            if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
                localStorage.removeItem('leaderboard');
                alert("All games Local Leaderboard Data is Cleared");
                textToSpeechEng('Local Leaderboard data cleared');
            }
        };

        fetch('../../leaderboard/lcleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
                document.getElementById("lcLeaderboardModal").style.display = 'none';
            });

        function openGlobalFeedback() {
            document.getElementById("fb-feedbackModal").style.display = 'flex';
        };

        function closeFBFeedback() {
            document.getElementById("fb-feedbackModal").style.display = 'none';
        };

        fetch('../../leaderboard/firebasefeedback.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('fb-feedbackModal').innerHTML = htmlText;
                document.getElementById("fb-feedbackModal").style.display = 'none';
            });

        (async () => {
            const GAME_NAME = "Rock Paper Scissor";
            const GAME_SHORT = "rockpaperscissor";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/rock_paper_scissor/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/rock_paper_scissor/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("../../sw.js")
                    .then(() => console.log("SW registered"))
                    .catch((err) => console.log("SW error", err));
            });
        }
    </script>
</body>

</html>
