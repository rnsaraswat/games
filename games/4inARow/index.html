<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>4 in a Row</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../commoncss.css">
  <link rel="manifest" href="../../manifest.json" />
  <meta name="theme-color" content="#6200ee" />
</head>

<body>

  <div id="container">
    <div class="main">
      <div id="left" class="section">
        <h1>4 IN A ROW</h1>
        <div class="Other-Buttons">
          <label for="gridSize">Grid Size:</label>
          <input type="number" id="gridSize" min="5" max="20" value="9">
          <button class="primary" id="startGame">🔄 New Game</button>
          <button id="undo-last">↩️ Undo</button>
          <select id="mode">
            <option value="pvp">😊Player vs 😊Player</option>
            <option value="pvc" selected>😊Player vs 🤖Computer</option>
          </select>
          <select id="difficulty">
            <option value="easy">😊 Easy</option>
            <option value="medium">🤔 Medium</option>
            <option value="hard" selected>🤯 Hard</option>
          </select>
          <button id="toggle-theme">☀️ Light</button>
          <button id="toggle-sound">🔇 Music:Off"</button>
          <button id="toggle-rules">View Rules</button>

          <button class="primary" id="local-toggle-leaderboard">🏆 Local Leaderboard</button>
          <button class="primary" id="toggle-leaderboard">🌍 Global Leaderboard</button>
          <button class="primary" id="toggle-share">📤Sharing</button>
          <button id="shareBtn">Share</button>
          <!-- <img id="shareGeneratedImg" style="width:50%; border-radius:10px; margin:10px 0;"> -->

          <a id="downloadLink" style="display:none;">Download Image</a>
          <!-- <button onclick="shareScore('Memory Game', 120)">📤Share Score</button> -->
          <button id="nativeShare">Share image + link</button>
          <!-- <button id="toggle-share" onclick="openSharePopup(250)">Share Your Score</button> -->
          <!-- <button onclick="openShare('4 in a row')">Share</button> -->
          <!-- <button onclick="shareScore('Memory Game', 150)">Share Score</button> -->
          <button class="primary" id="toggle-feedback">📝Feedback</button>
        </div>
        <div>
          <div id="timer-display">⏱️ 00:00:00</div>
          <div id="message">Select grid size <br>Click New Game to play</div>
          <p id="loading">Loading...</p>
          <h3>जनरेट की गई इमेज:</h3>
          <img id="outputImage" alt="Generated Canvas Image">
        </div>
      </div>
      <section id="right">
        <div id="grid"></div>
      </section>
    </div>
  </div>
  <div id="leaderboardPopup" class="popupWindow"></div>
  <div id="localleaderboardPopup" class="popupWindow"></div>
  <div id="feedbackPopup" class="popupWindow"></div>
  <!-- <div id="sharePopup1"></div> -->
  <!-- <div id="sharePopup" class="popupWindow"></div> -->
  <div id="rulesPopup" class="popupWindow">
    <div class="popupHeadeer">
      <h3>Game Rules</h3>
      <button class="primary" id="hide-rules">Hide Rules</button>
    </div>
    <div class="popupContent">
      <ul id="RulesBox"></ul>
    </div>
  </div>
  <div id="winText">🎉 You Won! 🎉</div>
  <div class="namebar" id="namebar" aria-live="polite">
    <div class="row">
      <div>Player Name : <span id="player1"></span></div>
      <label for="nameInput">Other Player Name :
        <input type="text" id="nameInput" placeholder="ABC" value="ABC">
      </label>
      <button id="name" class="primary">Ok</button>
    </div>
  </div>
  <canvas id="fireworksCanvas"></canvas>
  <script type="module" src="js/script.js"></script>
  <script type="module" src="js/rules.js"></script>
  <script type="module" src="../../leaderboard/feedback.js"></script>

  <script src="../../leaderboard/share-common.js"></script> -->

  <script type="module">
    import { renderLeaderboard, saveScore, sortTable } from '../../leaderboard/leaderboard.js';

    window.sortTable = sortTable;
    window.submitScore = async function (player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at) {
      try {
        await saveScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);
      } catch (e) {
        document.getElementById("msg").textContent = 'Error saving score in global leaderboard:' + e;
      }
    };
    document.addEventListener('DOMContentLoaded', () => {
      renderLeaderboard('3inarow');
    });
  </script>

  <script type="module">
    import { localrenderLeaderboard, saveToLeaderboard } from '../../leaderboard/localleaderboard.js';
    document.addEventListener('DOMContentLoaded', () => {
      localrenderLeaderboard();
    });
  </script>

  <script>
    function hideFeedback() {
      document.getElementById("feedbackPopup").style.display = 'none';
    };

    function hideLB() {
      document.getElementById("leaderboardPopup").style.display = 'none';
    };

    function hideLLB() {
      document.getElementById("localleaderboardPopup").style.display = 'none';
    };

    // function hideShare() {
    //   document.getElementById("shareOverlay").style.display = 'none';
    // };

    function clearLLB() {
      if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
        localStorage.removeItem('leaderboard');
        alert("All games Local Leaderboard Data is Cleared");
        textToSpeechEng('Local Leaderboard data cleared');
      }
    };

    fetch('../../leaderboard/leaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('leaderboardPopup').innerHTML = htmlText;
      });

    fetch('../../leaderboard/localleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('localleaderboardPopup').innerHTML = htmlText;
      });

    fetch('../../leaderboard/feedback.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('feedbackPopup').innerHTML = htmlText;
      });

    // fetch('../../leaderboard/share.html')
    //   .then(response => response.text())
    //   .then(htmlText => {
    //     document.getElementById('sharePopup').innerHTML = htmlText;
    //   });

    document.getElementById("leaderboardPopup").style.display = 'none';
    document.getElementById("localleaderboardPopup").style.display = 'none';
    document.getElementById("feedbackPopup").style.display = 'none';
    // document.getElementById("sharePopup").style.display = 'none';

    document.getElementById("toggle-leaderboard").addEventListener("click", () => {
      if (document.getElementById("toggle-leaderboard").style.display === 'block') {
        document.getElementById("leaderboardPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("leaderboardPopup").style.display = 'block';
        loadCSS()
      }
    });

    document.getElementById("local-toggle-leaderboard").addEventListener("click", () => {
      if (document.getElementById("leaderboardPopup").style.display === 'block') {
        document.getElementById("localleaderboardPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("localleaderboardPopup").style.display = 'block';
        loadCSS();
      }
    });

    document.getElementById("toggle-feedback").addEventListener("click", () => {
      if (document.getElementById("feedbackPopup").style.display === 'block') {
        document.getElementById("feedbackPopup").style.display = 'none';
        return;
      } else {
        document.getElementById("feedbackPopup").style.display = 'block';
        loadfeedbakCSS();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("toggle-share");
      btn.addEventListener("click", () => {
        // call the global shareScore (it should be attached to window)
        window.shareScore && window.shareScore("4inarow", 120);
      });
    });

    // document.getElementById("toggle-share").addEventListener("click", () => {
    //   if (document.getElementById("sharePopup").style.display === 'block') {
    //     document.getElementById("sharePopup").style.display = 'none';
    //     return;
    //   } else {
    //     document.getElementById("sharePopup").style.display = 'block';
    //     loadshareCSS();
    //     document.getElementById("shareOverlay").style.display = 'block';
    //   }
    // });

    // document.getElementById("shareOverlay").addEventListener("click", () => {
    //     shareScore('4 in a row');
    //   openShare(250)
    // });

    // function loadshareCSS() {
    //   var head = document.head;
    //   var link = document.createElement('link');
    //   link.rel = 'stylesheet';
    //   link.type = 'text/css';
    //   link.href = '../../leaderboard/share.css';
    //   head.appendChild(link);
    // }

    function loadfeedbakCSS() {
      var head = document.head;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = '../../leaderboard/feedback.css';
      head.appendChild(link);
    }

    function loadCSS() {
      var head = document.head;
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = '../../leaderboard/leaderboard.css';
      head.appendChild(link);
    }

    window.onload = function () {
      loadCSS();
      loadfeedbakCSS();
      // loadshareCSS();
    };
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then(() => console.log("SW registered"))
          .catch((err) => console.log("SW error", err));
      });
    }
  </script>
</body>

</html>
