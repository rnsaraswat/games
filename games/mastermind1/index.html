  <script type="module" src="js/script.js"></script>
  <script type="module" src="js/rules.js"></script>
  <script>
    document.getElementById("FB-feedbackModal").style.display = 'none';
    document.getElementById("lcLeaderboardModal").style.display = 'none';
    document.getElementById("firebaseLeaderboardModal").style.display = 'none';
    document.getElementById("winText").style.display = 'none';
    document.getElementById("rulesPopup").style.display = 'none';

    const themeToggle = document.getElementById('toggle-theme');
    function setTheme(t) {
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '☀️ Light'
      }
      if (t === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '🌙 Dark'
      }
    }
    if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
    setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

    function openFirebaseGlobalLeaderboard() {
      document.getElementById("firebaseLeaderboardModal").style.display = 'flex';
    };

    function closeFirebaseGlobalLeaderboard() {
      document.getElementById("firebaseLeaderboardModal").style.display = 'none';
    };

    fetch('../../leaderboard/firebasegbleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('firebaseLeaderboardModal').innerHTML = htmlText;
        document.getElementById("firebaseLeaderboardModal").style.display = 'none';
      });

    function openLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'flex';
    };

    function closeLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'none';
    };

    function clearLLB() {
      if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
        localStorage.removeItem('leaderboard');
        alert("All games Local Leaderboard Data is Cleared");
        textToSpeechEng('Local Leaderboard data cleared');
      }
    };

    fetch('../../leaderboard/lcleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
        document.getElementById("lcLeaderboardModal").style.display = 'none';
      });

      function openFBFeedbackV2() {
            const modal = document.getElementById("FB-feedbackModal");
            if (!modal) {
                console.error("FB-feedbackModal not found");
                return;
            }
            modal.style.display = "flex";
        }

        function closeFBFeedback() {
            const modal = document.getElementById("FB-feedbackModal");
            if (!modal) return;
            modal.style.display = "none";
        }

        fetch('../../leaderboard/feedback.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Feedback HTML load failed: " + response.status);
                }
                return response.text();
            })
            .then(htmlText => {
                const modal = document.getElementById("FB-feedbackModal");
                if (!modal) {
                    console.error("FB-feedbackModal not found");
                    return;
                }
                modal.innerHTML = htmlText;
                modal.style.display = "none";
            })
            .catch(error => {
                console.error("Feedback V2 load error:",error);
            });

    (async () => {
      const GAME_NAME = "Mastermind Game";
      const GAME_SHORT = "mastermind";

      const res = await fetch("../../manifest.json");
      const manifest = await res.json();

      manifest.short_name = GAME_SHORT;
      manifest.name = GAME_NAME;

      manifest.start_url = 'https://rnsaraswat.github.io/games/games/mastermind/index.html';
      manifest.scope = 'https://rnsaraswat.github.io/games/games/mastermind/index.html';

      // 🔥 icons ko absolute banane ka safety fix
      manifest.icons = manifest.icons.map(icon => ({
        ...icon,
        src: new URL(icon.src, location.origin).href
      }));

      const blob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);
    })();
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("../../sw.js")
          .then(() => console.log("SW registered"))
          .catch((err) => console.log("SW error", err));
      });
    }
  </script>
