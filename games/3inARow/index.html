<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 in a Row</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="gbfeedback.css" />
    <meta name="theme-color" content="#6200ee" />
</head>

<body>
    <div id="container">
        <!-- Left Panel -->
        <div id="left" class="section">
            <h1>3 IN A ROW</h1>
            <div class="button-group">
                <label for="gridSize">Grid Size:</label>
                <input type="number" id="gridSize" min="3" max="20" value="5">
                <button id="startGame">🔄 New Game</button>
                <button id="undo-last">↩️ Undo</button>
                <select id="mode">
                    <option value="pvp">😊Player vs 😊Player</option>
                    <option value="pvc">😊Player vs 🤖Computer</option>
                </select>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <button id="toggle-theme">☀️ Light</button>
                <!-- to background music on / off button -->
                <button id="toggle-sound">🔇 Music:Off"</button>
                <!-- <button id="toggle-leaderboard">View Leaderboard</button>
                <button onclick="clearLeaderboard()">Clear Leaderboard</button> -->
                <button id="local-toggle-leaderboard">Local Leaderboard</button>
                <button id="toggle-leaderboard">Global Leaderboard</button>
                <button class="primary" id="shareBtn">📤Sharing</button>

                <button class="primary" id="toggle-feedback">📝Feedback</button>
                <button id="openFeedback" class="primary-btn">💬 Feedback</button>
                <button class="primary"
                    onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
                <div id="timerdisplay">⏱️ 00:00:00</div>
            </div>
            <div id="message">Select grid size <br>Click New Game to play</div>
            <!-- <div class="scoreboard">
                <p>😊 Human: <span id="humanScore">0</span></p>
                <p>🤖 Computer: <span id="ComputerScore">0</span></p>
                <p>🤝 Draws: <span id="draws">0</span></p>
            </div> -->
            <p id="loading">Loading...</p>
            <!-- <div id="leaderboard">
                <h3>🏆 Leaderboard</h3>
                <ul id="score-list"></ul>
            </div> -->
        </div>
        <!-- Right Grid -->
        <div id="right">
            <div id="board"></div>
        </div>
        <div id="leaderboardPopup" class="popupWindow">
        </div>
        <div id="localleaderboardPopup" class="popupWindow">
        </div>
        <div id="feedbackPopup" class="popupWindow"></div>
    </div>

    <!-- Feedback Modal    main-container -->
    <!-- <div id="feedbackModal" class="modal"> -->
    <div id="feedbackModal" class="feedback-main-cntainer">
        <!--    header section -->
        <!-- <div class="modal-content"> -->
        <div class="feedback-header-section">
            <!-- <span id="closeFeedback" class="popupClose">Close X</span> -->
            <span id="feedbackCloseBtn" class="feedbackPopupClose">Close X</span>
            <h2 class="feedback-h2">Comments, Feedback, Suggestions</h2>
            <strong id="userName" class="feedback-userName"></strong>
            <!-- <input type="text" id="userName" placeholder="Your Name" /> -->
            <textarea id="userFeedback" class="fedback-textarea"
                placeholder="Write your comments / feedback / suggestions..."></textarea>
        </div>
        <div class="feedback-btn-container">
            <!-- लाइक बटन -->
            <button id="likeBtn" class="feedback-btn">👍</button>

            <!-- डिसलाइक बटन -->
            <button id="dislikeBtn" class="feedback-btn">👎</button>
            <button onclick="toggleReport()" class="feedback-btn">🚩</button>
            <!-- रेटिंग ड्रॉपडाउन -->
            <label for="rating" class="feedback-btn">Rating:
                <select id="ratingSelect" class="feedback-btn">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select></label>
            <button id="submitFeedback" class="feedback-btn">Submit</button>

        </div>
        <hr />
        <div id="feedbackList" class="feedback-list"></div>
        <!-- <div class="feedback-footer-section"></div> -->
    </div>
    </div>

    <script type="module" src="./js/script.js"></script>
    <script type="module" src="./js/gbfeedback.js"></script>
    <script type="module">
        import { shareScore } from '../../leaderboard/share.js';
        document.getElementById("shareBtn").addEventListener("click", async () => {
            shareScore("5inARow", 0);
        });
    </script>
    <script type="module">
        // import { saveToLeaderboard } from '../../leaderboard/localleaderboard.js';
        import { renderLeaderboard, saveScore, sortTable } from '../../leaderboard/leaderboard.js';

        window.sortTable = sortTable;
        window.submitScore = async function (player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at) {
            try {
                await saveScore(player_name, player_opponent, email, size, difficulty, game_id, score, elapsed, moves, filed1, filed2, filed3, filed4, created_at);
            } catch (e) {
                document.getElementById("msg").textContent = 'Error saving score in global leaderboard:' + e;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderLeaderboard('3inarow');
        });
    </script>

    <script type="module">
        import { localrenderLeaderboard } from '../../leaderboard/localleaderboard.js';

        document.addEventListener('DOMContentLoaded', () => {
            localrenderLeaderboard();
        });
    </script>

    <script>
        function hideFeedback() {
            document.getElementById("feedbackPopup").style.display = 'none';
        };

        function hideLB() {
            document.getElementById("leaderboardPopup").style.display = 'none';
        };

        function hideLLB() {
            document.getElementById("localleaderboardPopup").style.display = 'none';
        };

        function clearLLB() {
            if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
                localStorage.removeItem('leaderboard');
                alert("All games Local Leaderboard Data is Cleared");
                textToSpeechEng('Local Leaderboard data cleared');
            }
        };

        fetch('../../leaderboard/leaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('leaderboardPopup').innerHTML = htmlText;
            });

        fetch('../../leaderboard/localleaderboard.html')
            .then(response => response.text())
            .then(htmlText => {
                document.getElementById('localleaderboardPopup').innerHTML = htmlText;
            });

        document.getElementById("leaderboardPopup").style.display = 'none';
        document.getElementById("localleaderboardPopup").style.display = 'none';
        document.getElementById("feedbackPopup").style.display = 'none';

        document.getElementById("toggle-leaderboard").addEventListener("click", () => {
            if (document.getElementById("toggle-leaderboard").style.display === 'block') {
                document.getElementById("leaderboardPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("leaderboardPopup").style.display = 'block';
                loadCSS()
            }
        });

        document.getElementById("local-toggle-leaderboard").addEventListener("click", () => {
            if (document.getElementById("leaderboardPopup").style.display === 'block') {
                document.getElementById("leaderboardPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("leaderboardPopup").style.display = 'block';
                loadCSS();
            }
        });

        document.getElementById("toggle-feedback").addEventListener("click", () => {
            if (document.getElementById("feedbackPopup").style.display === 'block') {
                document.getElementById("feedbackPopup").style.display = 'none';
                return;
            } else {
                document.getElementById("feedbackPopup").style.display = 'block';
                loadfeedbakCSS();
            }
        });

        function loadfeedbakCSS() {
            var head = document.head;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = '../../leaderboard/feedback.css';
            head.appendChild(link);
        }


        function loadCSS() {
            var head = document.head;
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.type = 'text/css';
            link.href = '../../leaderboard/leaderboard.css';
            head.appendChild(link);
        }


        window.onload = function () {
            loadCSS();
            loadfeedbakCSS();
        };

        (async () => {
            const GAME_NAME = "3 IN A ROW";
            const GAME_SHORT = "3inARow";

            const res = await fetch("../../manifest.json");
            const manifest = await res.json();

            manifest.short_name = GAME_SHORT;
            manifest.name = GAME_NAME;

            manifest.start_url = 'https://rnsaraswat.github.io/games/games/3inARow/index.html';
            manifest.scope = 'https://rnsaraswat.github.io/games/games/3inARow/index.html';

            // 🔥 icons ko absolute banane ka safety fix
            manifest.icons = manifest.icons.map(icon => ({
                ...icon,
                src: new URL(icon.src, location.origin).href
            }));

            const blob = new Blob(
                [JSON.stringify(manifest)],
                { type: "application/json" }
            );

            const url = URL.createObjectURL(blob);

            const link = document.createElement("link");
            link.rel = "manifest";
            link.href = url;
            document.head.appendChild(link);
        })();
    </script>

    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("./sw.js")
                    .then(() => console.log("SW registered"))
                    .catch((err) => console.log("SW error", err));
            });
        }
    </script>
</body>

</html>
