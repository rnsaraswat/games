<div id="sharePopup" class="popup" style="display:none;align-items:center;justify-content:center;">
    <div class="popup-box" role="dialog" aria-modal="true">
      <h3 id="shareTitle">Share Your Score</h3>
      <div id="shareImagePreview" style="width:100%;height:150px;background:#ddd;background-size:cover;background-position:center;margin:8px 0;border-radius:8px;"></div>
      <p id="shareText">...</p>
  
      <div style="display:flex;flex-direction:column;gap:8px;margin:10px 0;">
        <a id="whatsappShare" target="_blank" rel="noopener">WhatsApp</a>
        <a id="facebookShare" target="_blank" rel="noopener">Facebook</a>
        <a id="telegramShare" target="_blank" rel="noopener">Telegram</a>
        <a id="twitterShare" target="_blank" rel="noopener">Twitter</a>
        <a id="instagramShare" target="_blank" rel="noopener">Instagram</a>
      </div>
  
      <input id="shareLinkInput" readonly style="width:100%;padding:8px;border-radius:6px;border:1px solid #ccc;">
      <div style="margin-top:8px;display:flex;gap:8px;">
        <button id="copyBtn">Copy Link</button>
        <button id="closePopup">Close</button>
      </div>
    </div>
  </div>
