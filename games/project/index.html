<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Game Page - Demo</title>
  <link rel="stylesheet" href="share.css">
</head>

<body>
  <h1>Demo Game</h1>

  <!-- ONE button per page (give it id) -->
  <button id="shareBtn">Share Score Desktop</button>
  <button id="shareBtn1">Share Score mobile</button>
  <button class="button-primary" id="shareBtn2">📤Sharing</button>

  <!-- Loader for popup (will fetch and inject share-popup.html) -->
  <script>
    // share-popup loader: fetch and append; then dispatch event
    (function () {
      fetch("share-popup.html")
        .then(r => {
          if (!r.ok) throw new Error("popup not found");
          return r.text();
        })
        .then(html => {
          const div = document.createElement("div");
          div.innerHTML = html;
          document.body.appendChild(div);

          // Notify that popup loaded
          window.__sharePopupLoaded = true;
          document.dispatchEvent(new Event("sharePopupLoaded"));
        })
        .catch(err => {
          console.warn("share-popup load failed:", err);
          // still dispatch so code doesn't wait forever
          window.__sharePopupLoaded = false;
          document.dispatchEvent(new Event("sharePopupLoaded"));
        });
    })();
  </script>

  <!-- main share system -->
  <script   type="module" src="share.js"></script>
  <script   type="module" src="sharedesktop.js"></script>

  <script type="module">
    import { shareScore } from './share.js';
    import { requestShare } from './sharedesktop.js';
    // Example: attach share action (no inline onclick)
    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("shareBtn");
      const btn1 = document.getElementById("shareBtn1");
      btn.addEventListener("click", () => {
        // call with object (robust): game, score, link, image
        requestShare({ game: "Memory Game", score: 250, link: `https://rnsaraswat.github.io/games/`, image: "images/RGHlogo.jpg" });
      });

      btn1.addEventListener("click", () => {
        // call with object (robust): game, score, link, image
        const gameName = "Project";
        const score = 0;
        shareScore(gameName, score);
        // window.shareMobile();
      });

      document.getElementById("shareBtn2").addEventListener("click", async () => {
      shareScore("5inARow", 0);
    });
    });
  </script>
</body>

</html>
