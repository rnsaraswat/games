<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5 in a Row</title>
  <meta name="description"
    content="Ravindra Games Hub — collection of lightweight web games (5 in a Row) Classic & Action-Oriented X vs O game">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../leaderboard/gbfeedback.css" />
  <link rel="stylesheet" href="../../leaderboard/gbleaderboard.css" />
  <link rel="stylesheet" href="../../leaderboard/lcleaderboard.css" />
  <link rel="stylesheet" href="../../commoncss.css">
  <link rel="manifest" href="../../manifest.json" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <meta name="theme-color" content="#6200ee" />
</head>

<body>

  <div id="container">
    <div class="main">
      <!-- Left Panel -->
      <div id="left" class="section">
        <h1>5 in a Row</h1>

        <div class="button-group">
          <label for="gridSize">⊞ Grid Size:</label>
          <input type="number" id="gridSize" min="6" max="20" value="9">
          <button class="primary" id="startGame">🔄 New Game</button>
          <button id="undo-last">↩️Undo</button>
          <select id="mode">
            <option value="pvp">😊Player vs 😊Player</option>
            <option value="pvc" selected>😊Player vs 🤖Computer</option>
          </select>
          <select id="difficulty">
            <option value="easy">😊 Easy</option>
            <option value="medium">🤔 Medium</option>
            <option value="hard" selected>🤯 Hard</option>
          </select>
          <button id="toggle-theme">☀️ Light</button>
          <!-- to sound on / off button -->
          <button id="toggle-sound">🔇 Sound: Off</button>
          <button class="button-primary" id="toggle-gb-leaderboard" onclick="openGlobalLeaderboard()">🌍 Global
            Leaderboard</button>
          <button class="button-primary" id="toggle-lc-leaderboard" onclick="openLocalLeaderboard()">🏆 Local
            Leaderboard</button>
          <button class="button-primary" id="shareBtn">📤Sharing</button>
          <button class="button-primary" onclick="openGlobalFeedback()">💬 Feedback</button>
          <button class="button-primary"
            onclick="window.location.href='https://rnsaraswat.github.io/games/index.html'">🏠Home</button>
          <div id="timer-display">⏱️ 00:00:00</div>
        </div>

        <div id="message">Select grid size <br>Click New Game to play</div>
        <p id="loading">Loading...</p>
      </div>
      <!-- Right Grid -->
      <section id="right">
        <div id="grid"></div>
      </section>
    </div>
  </div>


  <div id="gb-feedbackModal" class="gb-feedback-main-container"></div>
  <div id="lcLeaderboardModal" class="lc-main-container"></div>
  <div id="gbLeaderboardModal" class="gb-main-container"></div>
  <div id="winText">🎉 You Won! 🎉</div>
  <div class="name-main-container" id="namebar">
    <div class="name-top-section">Player Name : <span id="player1"></span></div>
    <div class="name-mid-section">
      <label class="name-mid-section" for="nameInput">Other Player Name :
        <input type="text" id="nameInput" placeholder="ABC" value="ABC">
      </label>
    </div>
    <div class="name-footer-section">

      <button id="name" class="name-primary-button">Ok</button>
    </div>
  </div>


  <canvas id="fireworksCanvas"></canvas>
  <script type="module" src="../../leaderboard/gbfeedback.js"></script>
  <script type="module" src="../../leaderboard/gbleaderboard.js"></script>
  <script type="module" src="../../leaderboard/lcleaderboard.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script type="module" src="./js/confetti.js"></script>
  <script type="module" src="./js/sharemobile.js"></script>

  <script type="module" src="js/script.js"></script>
  <script type="module">
    import { shareScore } from './js/share.js';
    document.getElementById("shareBtn").addEventListener("click", async () => {
      shareScore("5inARow", 0);
    });
  </script>

  <script>

    const themeToggle = document.getElementById('toggle-theme');
    function setTheme(t) {
      if (t === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '☀️ Light'
      }
      if (t === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('rg_theme', t);
        themeToggle.textContent = '🌙 Dark'
      }
    }
    if (themeToggle) themeToggle.addEventListener('click', () => setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'light' : 'dark'));
    setTheme(localStorage.getItem('rg_theme') === 'dark' ? 'dark' : 'light');

    function openGlobalLeaderboard() {
      document.getElementById("gbLeaderboardModal").style.display = 'flex';
    };

    function closeGlobalLeaderboard() {
      document.getElementById("gbLeaderboardModal").style.display = 'none';
    };


    fetch('../../leaderboard/gbleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('gbLeaderboardModal').innerHTML = htmlText;
        document.getElementById("gbLeaderboardModal").style.display = 'none';
      });

    function openLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'flex';
    };

    function closeLocalLeaderboard() {
      document.getElementById("lcLeaderboardModal").style.display = 'none';
    };

    function clearLLB() {
      if (confirm("Do you realy Want to Remove all games local Leaderboard data?")) {
        localStorage.removeItem('leaderboard');
        alert("All games Local Leaderboard Data is Cleared");
        textToSpeechEng('Local Leaderboard data cleared');
      }
    };

    fetch('../../leaderboard/lcleaderboard.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('lcLeaderboardModal').innerHTML = htmlText;
        document.getElementById("lcLeaderboardModal").style.display = 'none';
      });

    function openGlobalFeedback() {
      document.getElementById("gb-feedbackModal").style.display = 'flex';
    };

    function closeGlobalFeedback() {
      document.getElementById("gb-feedbackModal").style.display = 'none';
    };

    fetch('../../leaderboard/gbfeedback.html')
      .then(response => response.text())
      .then(htmlText => {
        document.getElementById('gb-feedbackModal').innerHTML = htmlText;
        document.getElementById("gb-feedbackModal").style.display = 'none';
      });

    (async () => {
      const GAME_NAME = "5 IN A ROW";
      const GAME_SHORT = "5inARow";

      const res = await fetch("../../manifest.json");
      const manifest = await res.json();

      manifest.short_name = GAME_SHORT;
      manifest.name = GAME_NAME;

      manifest.start_url = 'https://rnsaraswat.github.io/games/games/5inARow/index.html';
      manifest.scope = 'https://rnsaraswat.github.io/games/games/5inARow/index.html';

      // 🔥 icons ko absolute banane ka safety fix
      manifest.icons = manifest.icons.map(icon => ({
        ...icon,
        src: new URL(icon.src, location.origin).href
      }));

      const blob = new Blob(
        [JSON.stringify(manifest)],
        { type: "application/json" }
      );

      const url = URL.createObjectURL(blob);

      const link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("../../sw.js")
          .then(() => console.log("SW registered"))
          .catch((err) => console.log("SW error", err));
      });
    }
  </script>
</body>

</html>
