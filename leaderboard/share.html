<!-- Share Popup -->
<div id="sharePopup" class="popup">
    <div class="popup-content">
        <span class="close" onclick="closeSharePopup()">&times;</span>

        <h2>Share Your Score</h2>

        <img id="shareGeneratedImg" style="width:100%; border-radius:10px; margin:10px 0;">

        <div class="icons">
            <a id="twLink" target="_blank" rel="noopener">🐦 Twitter</a>
            <a id="fbLink" target="_blank" rel="noopener">📘 Facebook</a>
            <a id="waLink" target="_blank" rel="noopener">💬 WhatsApp Web</a>
            <a id="tgLink" target="_blank" rel="noopener">📨 Telegram</a>
        </div>
    </div>
</div>
