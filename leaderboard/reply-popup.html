<div class="reply-popup" id="replyPopup">

    <div class="reply-popup-content">

        <div class="reply-header">

            <h2>

                Replies

            </h2>

            <button
                id="replyCloseBtn">

                ✕

            </button>

        </div>

        <div
            id="replyList"
            class="reply-list">

        </div>

        <div class="reply-form">

            <input
                id="replyName"
                type="text"
                maxlength="60"
                placeholder="Your name">

            <textarea
                id="replyMessage"
                maxlength="1000"
                placeholder="Write reply..."></textarea>

            <button
                id="replySendBtn">

                Send Reply

            </button>

        </div>

    </div>

</div>
