<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Global Feedback System</title>
    <link rel="stylesheet" href="../commoncss.css">
    <style>
        :root {
            --fb-bg: #ffcea9;
            --fb-bg-hover: #ff9748;
            --fb-text: #000000;
            --fb-border: #333;
            --fb-gradient1: #fe6201;
            --fb-gradient2: #ff904a;
            --fb-text-gradient: #ffff00;
            --fb-box-shadow: rgba(0, 0, 0, 0.2);
            --fb-btn-shadow: rgba(0, 0, 0, 0.2);
        }

        [data-theme='dark'] {
            --fb-bg: #686cff;
            --fb-bg-hover: #474dfb;
            --fb-text: #ffffff;
            --fb-border: #d9d8d8;
            --fb-gradient1: #0015ff;
            --fb-gradient2: #4a4aff;
            --fb-text-gradient: #ff904a;
            --fb-box-shadow: rgba(255, 255, 255, 0.5);
            --fb-btn-shadow: rgba(0, 0, 0, 0.2);
        }

        .fb-feedback-btn-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Arial, sans-serif;
            background: var(--gf-bg);
            color: var(--gf-text);
            border-bottom: 1px solid var(--gf-border);
            justify-content: center;
            flex-wrap: wrap;
        }

        .fb-feedback-btn {
            cursor: pointer;
            padding: 5px 10px;
            border: 1px solid var(--gf-border);
            background: var(--gf-bg);
            color: var(--gf-text);
            border-radius: 4px;
            transition: 0.3s;
        }

        .fb-feedback-btn:hover {
            background: var(--gf-bg-hover);
        }

        .fb-feedback-btn-spl {
            background: linear-gradient(to right, var(--gf-gradient1), var(--gf-gradient2), var(--gf-gradient1));
            background-size: 100% auto;
            transition: 0.5s ease-in-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

        }

        .fb-feedback-btn-spl:hover {
            background-position: right center;
            color: var(--gf-text);
            transform: translateY(-2px);
        }

        .gf-active-like {
            background-color: #4CAF50;
            color: white;
            border-color: #388E3C;
        }

        .gf-active-dislike {
            background-color: #f44336;
            color: white;
            border-color: #d32f2f;
        }

        #ratingSelect {
            padding: 5px;
            border-radius: 4px;
        }

        .fb-feedback-main-container {

            position: fixed;
            top: 50%;
            left: 50%;

            padding: 5px;
            border-radius: 5px;
            z-index: 10;

            background: var(--gf-bg);
            color: var(--gf-text);
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .fb-feedback-header-section {
            background: var(--gf-bg);
            color: var(--gf-text);
            text-align: center;
        }

        .fb-feedback-h2 {
            background: var(--gf-bg);

        }

        .fb-feedback-userName {
            background: var(--gf-bg);
            float: left;
        }

        .fb-fedback-textarea {

            width: 100%;

            padding: 8px;
        }

        .fb-feedbackPopupClose {

        .fb-feedbackPopupClose:hover {

            background: linear-gradient(90deg, #960505, #b91010);

            transform: translateY(-2px);
        }

        .fb-feedbackSignIn {

        }

        .fb-feedbackSignIn:hover {

        .pill {

    <script type="module">
        import { db } from "./firebase-config.js";
        // import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        // import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // const firebaseConfig = {
        //   apiKey: "AIzaSyCEEOj5ZaEs8LZ9HCEVPhapDFy0bw-N3D4",
        //   authDomain: "ravindra-games-hub-68e5f.firebaseapp.com",
        //   projectId: "ravindra-games-hub-68e5f",
        //   storageBucket: "ravindra-games-hub-68e5f.firebasestorage.app",
        //   messagingSenderId: "233066688435",
        //   appId: "1:233066688435:web:307f0bc7508df35579e5c6",
        //   measurementId: "G-B24P20E3K8"
        // };

        // const app = initializeApp(firebaseConfig);
        // const db = getFirestore(app);

        // export { db };
        // import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            query,
            orderBy,
            onSnapshot,
            doc,
            updateDoc,
            increment,
            arrayUnion,
            arrayRemove,
            getDocs,
            getDoc,
            startAfter,
            startAt,
            limit
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // User
        let user = localStorage.getItem("username") || "Guest";
        document.getElementById("userName").textContent = user;

        // Undo
        let last = "";
        let perPage = 10;
        let currentPage = 1;

        let firstDoc = null;
        let lastDoc = null;

        let pageStack = [];

        //Submit
        window.submitFeedback = async function () {
            let text = input.value;
            const rating = parseInt(document.getElementById("rating").value);
            if (!text) return;

            last = text;

            await addDoc(collection(db, "feedbacks"), {
                name: user,
                text,
                rating,
                time: new Date(),
                likes: 0,
                dislikes: 0,
                likedBy: [],
                dislikedBy: []
            });

            input.value = "";
        }

        // 🔙 Undo
        window.undo = () => input.value = last;

        // ❌ Clear
        window.clearBox = () => input.value = "";

        // 📥 Load Feedbacks
        const q = query(
            collection(db, "feedbacks"),
            orderBy("time", "desc")
        );

        //load feedback
        async function loadFeedbacks(direction = "first") {

            let q;

            if (direction === "next" && lastDoc) {
                q = query(
                    collection(db, "feedbacks"),
                    orderBy("time", "desc"),
                    startAfter(lastDoc),
                    limit(perPage)
                );
            }
            else if (direction === "prev" && pageStack.length) {
                let prev = pageStack.pop();
                q = query(
                    collection(db, "feedbacks"),
                    orderBy("time", "desc"),
                    startAt(prev),
                    limit(perPage)
                );
            }
            else {
                q = query(
                    collection(db, "feedbacks"),
                    orderBy("time", "desc"),
                    limit(perPage)
                );
                pageStack = [];
            }

            const snap = await getDocs(q);

            if (snap.empty) return;

            firstDoc = snap.docs[0];
            lastDoc = snap.docs[snap.docs.length - 1];

            let html = "";

            snap.forEach(d => {
                let data = d.data();
                let id = d.id;
                let liked = data.likedBy?.includes(user);
                let disliked = data.dislikedBy?.includes(user);

                html += `
<div class="feedback">
    <div style="display:flex; justify-content:space-between;margin-left:1vw;">
<strong>${data.name}</strong>
<p>⭐ ${"⭐".repeat(data.rating || 0)}</p>
<small>${formatIST(new Date(data.time.seconds * 1000).toLocaleString())}</small>
</div>
<div style="text-align:left";>${data.text}</div>

<div style="margin-top:0.6vw;">
<button onclick="like('${id}')" class="gb-feedback-btn" ${liked ? "disabled" : ""}>👍 ${data.likes}</button>
<button onclick="dislike('${id}')" class="gb-feedback-btn" ${disliked ? "disabled" : ""}>👎 ${data.dislikes}</button>

<button onclick="showReply('${id}')" class="gb-feedback-btn">💬Reply</button>
</div>
<div id="replyBox-${id}"></div>
<div id="replyList-${id}"></div>

</div>
`;

                loadReplies(id);
            });

            list.innerHTML = html;

            if (direction === "next") {
                pageStack.push(firstDoc);
                currentPage++;
            }

            if (direction === "prev") {
                currentPage--;
            }

            pageNo.value = currentPage;
        }

        // Like
        window.like = async (id) => {

            const ref = doc(db, "feedbacks", id);
            const snap = await getDoc(ref);
            const data = snap.data();

            // Already liked
            if (data.likedBy?.includes(user)) {
                alert("You already liked this!");
                return;
            }

            // If previously disliked → remove dislike first
            if (data.dislikedBy?.includes(user)) {
                await updateDoc(ref, {
                    dislikes: increment(-1),
                    dislikedBy: arrayRemove(user)
                });
            }

            // Add like
            await updateDoc(ref, {
                likes: increment(1),
                likedBy: arrayUnion(user)
            });

        };

        //dislike
        window.dislike = async (id) => {

            const ref = doc(db, "feedbacks", id);
            const snap = await getDoc(ref);
            const data = snap.data();

            // Already disliked
            if (data.dislikedBy?.includes(user)) {
                alert("You already disliked this!");
                return;
            }

            // If previously liked → remove like first
            if (data.likedBy?.includes(user)) {
                await updateDoc(ref, {
                    likes: increment(-1),
                    likedBy: arrayRemove(user)
