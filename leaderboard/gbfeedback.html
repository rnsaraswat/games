<div class="gb-feedback-header-section">
    <span id="feedbackCloseBtn" class="gb-feedbackPopupClose" onclick="closeGlobalFeedback()">Close X</span>
    <span class="gb-feedbackSignIn"><button class="button-primary"
        onclick="window.location.href='https://rnsaraswat.github.io/games/auth/login.html'">🚪Sign in</button></span>
    <h2 class="gb-feedback-h2">Comments, Feedback, Suggestions</h2>
    <strong id="userName" class="gb-feedback-userName"></strong>
    <textarea id="userFeedback" class="gb-fedback-textarea"
        placeholder="Write your comments / feedback / suggestions..."></textarea>
</div>

<div class="gb-feedback-btn-container">
    <button id="likeBtn" class="gb-feedback-btn">👍</button>

    <button id="dislikeBtn" class="gb-feedback-btn">👎</button>
    <button onclick="toggleReport()" class="gb-feedback-btn">🚩</button>
    <label for="rating" class="feedback-btn">Rating:
        <select id="ratingSelect" class="gb-feedback-btn">
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select></label>
    <button id="submitFeedback" class="gb-feedback-btn-spl">Submit</button>

</div>
<hr />
<!--    feedback section -->
<div id="feedbackList" class="gb-feedback-list"></div>
