<script type="module">
    import { supabase } from "../supabaseClient.js";
    async function completeLogin() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {

        const pad = (num) => num.toString().padStart(2, '0');
      const date = new Date();
      const guestName = `Guest${pad(date.getDate())}${pad(date.getMonth() + 1)}${date.getFullYear().toString().slice(-2)}_${pad(date.getHours())}${pad(date.getMinutes())}`;

        const name =
        user.user_metadata?.full_name ||
        user.user_metadata?.name ||
        user.email ||
        guestName;

        localStorage.setItem("player_name", name || guestName);
        localStorage.setItem("email", user.email || "-");
        localStorage.setItem("user_id", user.id || `Guest${Math.floor(Math.random() * 10000)}`);
        document.body.innerHTML = `
          <div style="display:grid;place-items:center;><h2>Login Successful!</h2>
          <p>Welcome, <b>${name}</b></p>
          <p>Email: <b>${user.email}</b></p>
          <a href="../index.html">Go to Home</a></div>
        `;
        // window.location.href = "../index.html";
        setTimeout(() => {
          window.location.href = "https://rnsaraswat.github.io/games/index.html";
        }, 1500);
      } else {
        document.body.innerHTML = `<div style="display:grid;place-items:center;"><p>Login failed. Please try again.</p></div>`;
      }
    }
    completeLogin();
  </script>
