<!doctype html>
<html lang="hi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in — Ravindra Games Hub</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../commoncss.css">
</head>

<body>
  <div class="login-container ">
    <div class="login-header-section">
      <h2>Sign in — Ravindra Games Hub</h2>
      <h3>Login to save your score</h3>
    </div>
    <div id="auth-section" class="login-btn-container">

      <button id="google-login" class="login-btn">Login with Google</button>
      <button id="facebook-login" class="login-btn">Login with Facebook</button>

      <form id="email-login" class="login-form-box">
        <input type="email" id="email" placeholder="Email (required)" required>
        <input type="text" id="name" placeholder="Name (required)" required>
        <button type="submit" class="login-btn">Login with Email</button>
      </form>
      <form id="guest-login" class="login-form-box">
        <input type="email" id="gemail" placeholder="Email (required)" required>
        <input type="text" id="gname" placeholder="Name (required)" required>
        <button type="submit" class="login-btn">Login as Guest with email</button>
      </form>
      <form id="guest" class="login-form-box">
        <input type="text" id="guname" placeholder="Name (Optional) Default Guest####">
        <button type="submit" class="login-btn">Login as Guest</button>
      </form>
      <div id="auth-status"></div>
    </div>
    <div class="login-footer-section">
      <p style="margin-top:12px;color:var(--muted)">After login you will be redirected back</p>
    </div>
  </div>
  <div id="alreadyLoginPopup" class="login-popup">
    <div class="login-popup-box">
      <h3>Already Logged In</h3>

      <button id="login-continue-button" class="button-primary">Continue list</button>
      <button  id="login-change-button" class="login-danger">Change Login list</button>
      <button class="button-primary" onclick="continueSession()">Continue</button>
      <button class="login-danger" onclick="changeAccount()">Change Login</button>
    </div>
  </div>
  <script type="module" src="./auth.js"></script>
  <script type="module">
        import { supabase } from "../supabaseClient.js";
    // Continue → Main Page
    function continueSession() {
      // redirectAfterLogin(); 
      window.location.href = "../index.html";
    }

    // Change Login → Logout + Login Page
    async function changeAccount() {
      await supabase.auth.signOut();
      localStorage.clear();
      window.location.href = "login.html";
    }
  </script>
</body>

</html>
